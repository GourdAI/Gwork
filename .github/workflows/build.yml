name: Desktop 多平台打包

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（留空则使用 package.json 当前版本）'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            label: Windows (nsis x64)
          - os: macos-latest
            platform: mac
            label: macOS (dmg x64+arm64)
          - os: ubuntu-latest
            platform: linux
            label: Linux (AppImage/deb x64)
    env:
      # GitHub runner 上走官方源下载 Electron 及 electron-builder 工具链
      # （覆盖 .npmrc 中面向国内网络的 npmmirror 镜像）
      ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
      ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17（Maven 编译 + jlink 生成内置 JRE）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 写入版本号
        shell: bash
        run: |
          set -e
          VERSION=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [ -n "$VERSION" ]; then
            cd gourd-ai-desktop
            npm version "$VERSION" --no-git-tag-version --allow-same-version
            echo "使用版本号: $VERSION"
          else
            echo "未指定版本号，使用 package.json 当前版本"
          fi

      # 对应本地 build.ps1 / build.sh 的 [1/5]
      # -Dgwork.build.revision：把 git 短 sha 写入 jar 内 build-info.properties（属性名与 pom 默认值一致）
      - name: Maven 构建后端 JAR
        shell: bash
        run: mvn -B -ntp -pl gourd-ai-agent -am package -DskipTests -Dgwork.build.revision=${GITHUB_SHA::7}

      # 对应本地构建脚本的 [2/5]
      - name: 复制 JAR 到 extraResources
        shell: bash
        run: |
          set -e
          mkdir -p gourd-ai-desktop/build/extraResources
          cp -f gourd-ai-agent/target/gourd-ai-agent.jar gourd-ai-desktop/build/extraResources/gourd-ai-agent.jar

      # 对应本地构建脚本的 [4/5]：模块清单与 build.ps1 / generate-jre.js 保持一致
      - name: 生成内置 JRE（Windows / Linux）
        if: matrix.platform != 'mac'
        shell: bash
        run: |
          set -e
          MODULES="java.base,java.logging,java.sql,java.naming,java.management,java.instrument,java.net.http,jdk.crypto.ec,jdk.zipfs,jdk.unsupported"
          JRE_DIR="gourd-ai-desktop/build/extraResources/jre"
          rm -rf "$JRE_DIR"
          "$JAVA_HOME/bin/jlink" --module-path "$JAVA_HOME/jmods" --add-modules "$MODULES" \
            --output "$JRE_DIR" --strip-debug --compress 2 --no-header-files --no-man-pages

      # macOS 需要同时出 x64 与 arm64 两个包：jlink 产物架构取决于 jmods，
      # 因此下载两种架构的 JDK，统一用本机 jlink 分别链接出两套 JRE。
      - name: 生成内置 JRE（macOS 双架构）
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          set -e
          MODULES="java.base,java.logging,java.sql,java.naming,java.management,java.instrument,java.net.http,jdk.crypto.ec,jdk.zipfs,jdk.unsupported"
          mkdir -p /tmp/jdk-x64 /tmp/jdk-arm64
          curl -fsSL -o /tmp/jdk-x64.tar.gz "https://api.adoptium.net/v3/binary/latest/17/ga/mac/x64/jdk/hotspot/normal/eclipse"
          curl -fsSL -o /tmp/jdk-arm64.tar.gz "https://api.adoptium.net/v3/binary/latest/17/ga/mac/aarch64/jdk/hotspot/normal/eclipse"
          tar -xzf /tmp/jdk-x64.tar.gz -C /tmp/jdk-x64 --strip-components=1
          tar -xzf /tmp/jdk-arm64.tar.gz -C /tmp/jdk-arm64 --strip-components=1
          X64_HOME="$(find /tmp/jdk-x64 -maxdepth 5 -name jmods -type d | head -n1 | sed 's|/jmods$||')"
          ARM_HOME="$(find /tmp/jdk-arm64 -maxdepth 5 -name jmods -type d | head -n1 | sed 's|/jmods$||')"
          echo "x64 JDK: $X64_HOME"
          echo "arm64 JDK: $ARM_HOME"
          OUT_X64="gourd-ai-desktop/build/jre-mac-x64"
          OUT_ARM="gourd-ai-desktop/build/jre-mac-arm64"
          rm -rf "$OUT_X64" "$OUT_ARM"
          "$JAVA_HOME/bin/jlink" --module-path "$X64_HOME/jmods" --add-modules "$MODULES" \
            --output "$OUT_X64" --strip-debug --compress 2 --no-header-files --no-man-pages
          "$JAVA_HOME/bin/jlink" --module-path "$ARM_HOME/jmods" --add-modules "$MODULES" \
            --output "$OUT_ARM" --strip-debug --compress 2 --no-header-files --no-man-pages
          # 保证可执行位（经压缩/解压或跨架构链接后可能丢失），否则包内 java 无法 spawn
          chmod +x "$OUT_X64/bin/"* "$OUT_ARM/bin/"*

      # 对应本地 build.sh / build.ps1 的图标同步步骤：托盘等运行时图标来自包内
      # Resources/icons/，而仓库只维护 resources/icons 一份源，CI 上必须先同步，
      # 否则 mac 包缺 icons 目录 → 托盘加载空图抛异常、中断后端引导
      - name: 同步运行时图标 (icons)
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          set -e
          mkdir -p gourd-ai-desktop/build/icons
          cp -f gourd-ai-desktop/resources/icons/icon.ico gourd-ai-desktop/build/icons/icon.ico
          cp -f gourd-ai-desktop/resources/icons/icon.png gourd-ai-desktop/build/icons/icon.png

      # builder-mac.json 引用 build/icons/icon.icns，仓库中只有 png，CI 上用系统工具生成
      - name: 生成 macOS 图标 (icon.icns)
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          set -e
          SRC="gourd-ai-desktop/build/icons/icon.png"
          DIR="$(mktemp -d)/icon.iconset"
          mkdir -p "$DIR"
          for s in 16 32 128 256 512; do
            sips -z "$s" "$s" "$SRC" --out "$DIR/icon_${s}x${s}.png" >/dev/null
            sips -z "$((s*2))" "$((s*2))" "$SRC" --out "$DIR/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$DIR" -o "gourd-ai-desktop/build/icons/icon.icns"

      # 对应本地构建脚本的 [5/5]（lockfile 未入库，使用 npm install；
      # .npmrc 中的 npmmirror 镜像在 runner 上不可达，先移除再安装）
      - name: 安装前端依赖
        shell: bash
        working-directory: gourd-ai-desktop
        run: |
          set -e
          rm -f .npmrc
          npm install

      - name: 打包（Windows / Linux）
        if: matrix.platform != 'mac'
        shell: bash
        working-directory: gourd-ai-desktop
        run: npm run build:${{ matrix.platform }}

      # 分两次打包：每次换入对应架构的 JRE，electron-builder 用 --x64/--arm64 过滤目标架构
      # 配置了 CSC_LINK 等 Secrets 时自动走 Developer ID 正式签名 + 公证；
      # 未配置时由 afterPack 钩子做 ad-hoc 签名（保证不产出「损坏包」）
      - name: 打包（macOS x64 + arm64）
        if: matrix.platform == 'mac'
        shell: bash
        working-directory: gourd-ai-desktop
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -e
          # Secret 未配置时，${{ secrets.XXX }} 会被渲染为空串（而非未定义）。
          # electron-builder 只要 CSC_LINK 已定义（即使是空串）就会走证书导入流程，
          # 并把空串当相对路径解析到项目根目录，报 "⨯ <项目目录> not a file"，
          # 因此打包前先 unset 空值，使行为与「未定义」一致
          [ -n "$CSC_LINK" ] || unset CSC_LINK
          [ -n "$CSC_KEY_PASSWORD" ] || unset CSC_KEY_PASSWORD
          [ -n "$APPLE_TEAM_ID" ] || unset APPLE_TEAM_ID
          [ -n "$APPLE_ID" ] || unset APPLE_ID
          [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] || unset APPLE_APP_SPECIFIC_PASSWORD
          if [ -n "$CSC_LINK" ]; then
            echo "签名模式: Developer ID 正式签名 + 公证"
          else
            echo "签名模式: ad-hoc（未配置证书 Secrets）"
          fi
          JRE="build/extraResources/jre"
          rm -rf "$JRE"
          cp -R build/jre-mac-x64 "$JRE"
          npm run build:mac -- --x64
          # 暂存 x64 打包生成的 latest-mac.yml（下一步 arm64 打包会覆盖它），arm64 打包后再合并，
          # 保证最终 latest-mac.yml 同时包含 x64 与 arm64 两个更新条目
          if [ -f out/latest-mac.yml ]; then cp -f out/latest-mac.yml out/latest-mac.x64.yml; fi
          rm -rf "$JRE"
          cp -R build/jre-mac-arm64 "$JRE"
          npm run build:mac -- --arm64
          if [ -f out/latest-mac.x64.yml ]; then
            node scripts/merge-latest-yml.js out/latest-mac.x64.yml out/latest-mac.yml out/latest-mac.yml
            rm -f out/latest-mac.x64.yml
          fi

      # 校验 ad-hoc 签名与资源密封，防止再次产出 arm64「文件已损坏」包
      - name: 校验 macOS 签名
        if: matrix.platform == 'mac'
        shell: bash
        working-directory: gourd-ai-desktop
        run: |
          set -e
          for app in out/mac-arm64/*.app out/mac/*.app; do
            [ -d "$app" ] || continue
            echo "校验: $app"
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dv --verbose=2 "$app" 2>&1 | grep -E "Authority|Signature=|TeamIdentifier" || true
          done

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: gwork-${{ matrix.platform }}
          path: |
            gourd-ai-desktop/out/*.exe
            gourd-ai-desktop/out/*.dmg
            gourd-ai-desktop/out/*.AppImage
            gourd-ai-desktop/out/*.deb
            gourd-ai-desktop/out/latest*.yml
            gourd-ai-desktop/out/*.blockmap
          if-no-files-found: error
