name: Desktop 多平台打包

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（留空则使用 package.json 当前版本）'
        required: false
        default: ''
      publish_release:
        description: '构建后发布到 GitHub Release（必须同时填写上面的版本号）'
        type: boolean
        required: false
        default: false
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            label: Windows (nsis x64)
          - os: macos-latest
            platform: mac
            label: macOS (dmg x64+arm64)
          - os: ubuntu-latest
            platform: linux
            label: Linux (AppImage/deb x64)
    env:
      # GitHub runner 上走官方源下载 Electron 及 electron-builder 工具链
      # （覆盖 .npmrc 中面向国内网络的 npmmirror 镜像）
      ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
      ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17（Maven 编译 + jlink 生成内置 JRE）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 写入版本号
        shell: bash
        run: |
          set -e
          VERSION=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [ -n "$VERSION" ]; then
            cd gourd-ai-desktop
            npm version "$VERSION" --no-git-tag-version --allow-same-version
            echo "使用版本号: $VERSION"
          else
            echo "未指定版本号，使用 package.json 当前版本"
          fi

      # 对应本地 build.ps1 / build.sh 的 [1/5]
      # -Dgwork.build.revision：把 git 短 sha 写入 jar 内 build-info.properties（属性名与 pom 默认值一致）
      - name: Maven 构建后端 JAR
        shell: bash
        run: mvn -B -ntp -pl gourd-ai-agent -am package -DskipTests -Dgwork.build.revision=${GITHUB_SHA::7}

      # 对应本地构建脚本的 [2/5]
      - name: 复制 JAR 到 extraResources
        shell: bash
        run: |
          set -e
          mkdir -p gourd-ai-desktop/build/extraResources
          cp -f gourd-ai-agent/target/gourd-ai-agent.jar gourd-ai-desktop/build/extraResources/gourd-ai-agent.jar

      # 对应本地构建脚本的 [4/5]：模块清单与 build.ps1 / generate-jre.js 保持一致
      - name: 生成内置 JRE（Windows / Linux）
        if: matrix.platform != 'mac'
        shell: bash
        run: |
          set -e
          MODULES="java.base,java.logging,java.sql,java.naming,java.management,java.instrument,java.net.http,jdk.crypto.ec,jdk.zipfs,jdk.unsupported"
          JRE_DIR="gourd-ai-desktop/build/extraResources/jre"
          rm -rf "$JRE_DIR"
          "$JAVA_HOME/bin/jlink" --module-path "$JAVA_HOME/jmods" --add-modules "$MODULES" \
            --output "$JRE_DIR" --strip-debug --compress 2 --no-header-files --no-man-pages

      # macOS 需要同时出 x64 与 arm64 两个包：jlink 产物架构取决于 jmods，
      # 因此下载两种架构的 JDK，统一用本机 jlink 分别链接出两套 JRE。
      - name: 生成内置 JRE（macOS 双架构）
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          set -e
          MODULES="java.base,java.logging,java.sql,java.naming,java.management,java.instrument,java.net.http,jdk.crypto.ec,jdk.zipfs,jdk.unsupported"
          mkdir -p /tmp/jdk-x64 /tmp/jdk-arm64
          curl -fsSL -o /tmp/jdk-x64.tar.gz "https://api.adoptium.net/v3/binary/latest/17/ga/mac/x64/jdk/hotspot/normal/eclipse"
          curl -fsSL -o /tmp/jdk-arm64.tar.gz "https://api.adoptium.net/v3/binary/latest/17/ga/mac/aarch64/jdk/hotspot/normal/eclipse"
          tar -xzf /tmp/jdk-x64.tar.gz -C /tmp/jdk-x64 --strip-components=1
          tar -xzf /tmp/jdk-arm64.tar.gz -C /tmp/jdk-arm64 --strip-components=1
          X64_HOME="$(find /tmp/jdk-x64 -maxdepth 5 -name jmods -type d | head -n1 | sed 's|/jmods$||')"
          ARM_HOME="$(find /tmp/jdk-arm64 -maxdepth 5 -name jmods -type d | head -n1 | sed 's|/jmods$||')"
          echo "x64 JDK: $X64_HOME"
          echo "arm64 JDK: $ARM_HOME"
          OUT_X64="gourd-ai-desktop/build/jre-mac-x64"
          OUT_ARM="gourd-ai-desktop/build/jre-mac-arm64"
          rm -rf "$OUT_X64" "$OUT_ARM"
          "$JAVA_HOME/bin/jlink" --module-path "$X64_HOME/jmods" --add-modules "$MODULES" \
            --output "$OUT_X64" --strip-debug --compress 2 --no-header-files --no-man-pages
          "$JAVA_HOME/bin/jlink" --module-path "$ARM_HOME/jmods" --add-modules "$MODULES" \
            --output "$OUT_ARM" --strip-debug --compress 2 --no-header-files --no-man-pages
          # 保证可执行位（经压缩/解压或跨架构链接后可能丢失），否则包内 java 无法 spawn
          chmod +x "$OUT_X64/bin/"* "$OUT_ARM/bin/"*

      # 对应本地 build.sh / build.ps1 的图标同步步骤：托盘等运行时图标来自包内
      # Resources/icons/，而仓库只维护 resources/icons 一份源，CI 上必须先同步，
      # 否则 mac 包缺 icons 目录 → 托盘加载空图抛异常、中断后端引导
      - name: 同步运行时图标 (icons)
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          set -e
          mkdir -p gourd-ai-desktop/build/icons
          cp -f gourd-ai-desktop/resources/icons/icon.ico gourd-ai-desktop/build/icons/icon.ico
          cp -f gourd-ai-desktop/resources/icons/icon.png gourd-ai-desktop/build/icons/icon.png

      # builder-mac.json 引用 build/icons/icon.icns，仓库中只有 png，CI 上用系统工具生成
      - name: 生成 macOS 图标 (icon.icns)
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          set -e
          SRC="gourd-ai-desktop/build/icons/icon.png"
          DIR="$(mktemp -d)/icon.iconset"
          mkdir -p "$DIR"
          for s in 16 32 128 256 512; do
            sips -z "$s" "$s" "$SRC" --out "$DIR/icon_${s}x${s}.png" >/dev/null
            sips -z "$((s*2))" "$((s*2))" "$SRC" --out "$DIR/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$DIR" -o "gourd-ai-desktop/build/icons/icon.icns"

      # 对应本地构建脚本的 [5/5]（lockfile 未入库，使用 npm install；
      # .npmrc 中的 npmmirror 镜像在 runner 上不可达，先移除再安装）
      - name: 安装前端依赖
        shell: bash
        working-directory: gourd-ai-desktop
        run: |
          set -e
          rm -f .npmrc
          npm install

      - name: 打包（Windows / Linux）
        if: matrix.platform != 'mac'
        shell: bash
        working-directory: gourd-ai-desktop
        run: npm run build:${{ matrix.platform }}

      # 分两次打包：每次换入对应架构的 JRE，electron-builder 用 --x64/--arm64 过滤目标架构
      # 配置了 CSC_LINK 等 Secrets 时自动走 Developer ID 正式签名 + 公证；
      # 未配置时由 afterPack 钩子做 ad-hoc 签名（保证不产出「损坏包」）
      - name: 打包（macOS x64 + arm64）
        if: matrix.platform == 'mac'
        shell: bash
        working-directory: gourd-ai-desktop
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -e
          # Secret 未配置时，${{ secrets.XXX }} 会被渲染为空串（而非未定义）。
          # electron-builder 只要 CSC_LINK 已定义（即使是空串）就会走证书导入流程，
          # 并把空串当相对路径解析到项目根目录，报 "⨯ <项目目录> not a file"，
          # 因此打包前先 unset 空值，使行为与「未定义」一致
          [ -n "$CSC_LINK" ] || unset CSC_LINK
          [ -n "$CSC_KEY_PASSWORD" ] || unset CSC_KEY_PASSWORD
          [ -n "$APPLE_TEAM_ID" ] || unset APPLE_TEAM_ID
          [ -n "$APPLE_ID" ] || unset APPLE_ID
          [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] || unset APPLE_APP_SPECIFIC_PASSWORD
          if [ -n "$CSC_LINK" ]; then
            echo "签名模式: Developer ID 正式签名 + 公证"
          else
            echo "签名模式: ad-hoc（未配置证书 Secrets）"
          fi
          JRE="build/extraResources/jre"
          rm -rf "$JRE"
          cp -R build/jre-mac-x64 "$JRE"
          npm run build:mac -- --x64
          # 暂存 x64 打包生成的 latest-mac.yml（下一步 arm64 打包会覆盖它），arm64 打包后再合并，
          # 保证最终 latest-mac.yml 同时包含 x64 与 arm64 两个更新条目
          if [ -f out/latest-mac.yml ]; then cp -f out/latest-mac.yml out/latest-mac.x64.yml; fi
          rm -rf "$JRE"
          cp -R build/jre-mac-arm64 "$JRE"
          npm run build:mac -- --arm64
          if [ -f out/latest-mac.x64.yml ]; then
            node scripts/merge-latest-yml.js out/latest-mac.x64.yml out/latest-mac.yml out/latest-mac.yml
            rm -f out/latest-mac.x64.yml
          fi

      # 校验 ad-hoc 签名与资源密封，防止再次产出 arm64「文件已损坏」包
      - name: 校验 macOS 签名
        if: matrix.platform == 'mac'
        shell: bash
        working-directory: gourd-ai-desktop
        run: |
          set -e
          for app in out/mac-arm64/*.app out/mac/*.app; do
            [ -d "$app" ] || continue
            echo "校验: $app"
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dv --verbose=2 "$app" 2>&1 | grep -E "Authority|Signature=|TeamIdentifier" || true
          done

      # ── 逐个文件上传，每个安装包 = 一个独立 artifact（不再打成 zip） ──
      # upload-artifact v7 的 archive: false 才能跳过 zip 包装，但它有两条硬约束：
      #   1. 一次只能传**一个**文件，glob 匹配到多个直接失败；
      #   2. artifact 名恒等于文件 basename，`name:` 参数被忽略
      #      （@actions/artifact 在 skipArchive 分支里 name = basename(files[0])）。
      # 所以不能再用一条 path 列表把整个平台的产物一起传，只能按产物类型拆成独立步骤。
      # 副作用是 artifact 名不再有 gwork-* 前缀，release job 的 pattern 也随之取消。
      #
      # latest*.yml / *.blockmap 是 electron-updater 的更新元数据，不是给人下载的安装包，
      # 但发布时必须随包上 Release，否则老客户端检不到更新，所以一并上传。
      - name: 上传安装包（Windows nsis）
        if: ${{ !cancelled() && matrix.platform == 'win' }}
        uses: actions/upload-artifact@v7
        with:
          path: gourd-ai-desktop/out/*.exe
          archive: false
          if-no-files-found: error

      - name: 上传安装包（Linux AppImage）
        if: ${{ !cancelled() && matrix.platform == 'linux' }}
        uses: actions/upload-artifact@v7
        with:
          path: gourd-ai-desktop/out/*.AppImage
          archive: false
          if-no-files-found: error

      - name: 上传安装包（Linux deb）
        if: ${{ !cancelled() && matrix.platform == 'linux' }}
        uses: actions/upload-artifact@v7
        with:
          path: gourd-ai-desktop/out/*.deb
          archive: false
          if-no-files-found: error

      # mac 两个架构的 dmg 同时存在于 out/，而 archive: false 一次只收一个，必须拆两步。
      # 注意不能写成 *-x64.dmg：builder-mac.json 没配 artifactName，electron-builder 的
      # 默认命名对 x64 **不加架构后缀**（archSuffix 在 x64 时为空串），只有 arm64 带
      # -arm64。故 x64 那步用「全部 dmg 减去 arm64」的排除写法，两种命名下都成立。
      - name: 上传安装包（macOS dmg x64）
        if: ${{ !cancelled() && matrix.platform == 'mac' }}
        uses: actions/upload-artifact@v7
        with:
          path: |
            gourd-ai-desktop/out/*.dmg
            !gourd-ai-desktop/out/*-arm64.dmg
          archive: false
          if-no-files-found: error

      - name: 上传安装包（macOS dmg arm64）
        if: ${{ !cancelled() && matrix.platform == 'mac' }}
        uses: actions/upload-artifact@v7
        with:
          path: gourd-ai-desktop/out/*-arm64.dmg
          archive: false
          if-no-files-found: error

      # 更新元数据：每平台一个 latest*.yml（win 为 latest.yml、mac 为 latest-mac.yml、
      # linux 为 latest-linux.yml），同一腿内只有一个，可安全地用通配匹配。
      - name: 上传更新清单 latest*.yml
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          path: gourd-ai-desktop/out/latest*.yml
          archive: false
          if-no-files-found: warn

      # blockmap 用于差分更新，可选；数量不确定（每个安装包一个），所以不能用
      # archive: false 逐个传（会因多文件失败），也不值得为它拆很多步骤。
      # 它不是用户会去下载的东西，打成一个 zip 不影响「每个安装包单独一个包」的目标；
      # 发布步骤会把它解开后平铺到 Release。
      - name: 上传 blockmap（差分更新用）
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: gwork-blockmap-${{ matrix.platform }}
          path: gourd-ai-desktop/out/*.blockmap
          if-no-files-found: warn

  # 打 v* tag 时把三平台产物汇总发布到同名 GitHub Release。
  # 在此之前产物只存在于 Actions 的 artifact 中（保留期有限、且需登录才能下载），
  # Release 页面始终是空的 —— 这就是「构建完不会自动发布」的直接原因。
  #
  # 为什么用 gh CLI 而不是第三方 release action：Electron 版与 Tauri 版是两条
  # 独立流水线，同一个 tag 会**同时**往同一个 Release 写资产。gh 的
  # 「view 探测 → create 失败即忽略 → upload --clobber」组合天然幂等，
  # 两条流水线谁先到都不会互相踩，重跑也能原地覆盖补传。
  release:
    name: 发布到 GitHub Release
    needs: build
    # 触发条件：打 v* tag，或手动触发时勾选了 publish_release。
    # 原来只认 tag，于是 workflow_dispatch 跑出来的构建即使全绿，发布 job 也恒为
    # skipped（截图里那个灯色的⊘ 就是它）。手动发布必须填 version：没有 tag 时
    # 它既是 Release 的 tag 名，也是安装包版本号。
    if: |
      always() && needs.build.result != 'cancelled' &&
      (startsWith(github.ref, 'refs/tags/v') ||
       (github.event_name == 'workflow_dispatch' && inputs.publish_release))
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 创建 Release、上传资产所需（默认 token 只读）
    # 本 job **刻意不做 actions/checkout**：它只下载 artifact 再上传 Release，不碰源码。
    # 但 gh 需要知道「操作哪个仓库」——它默认从当前目录的 `git remote get-url origin`
    # 推断，而 runner 的工作目录此刻不是 git 仓库，于是每条 gh 命令都直接失败：
    #   failed to run git: fatal: not a git repository (or any of the parent directories): .git
    # 报错信息完全不提「仓库没指定」，极易被误读成 git/权限问题。
    # GH_REPO 显式补上这份上下文，无需为此多 clone 一遍仓库（checkout 也能消除报错，
    # 但那是「为了让推断步骤有东西可推断」而拉一份用不上的源码，代价白花）。
    # 注意必须写 github.repository：env.GITHUB_REPOSITORY 在表达式里取不到（此时
    # 默认环境变量尚未注入 env 上下文），会渲染成空串，等于没设。
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      # 不写 pattern：安装包现在以 archive: false 上传，artifact 名就是文件名，
      # 没有 gwork-* 前缀了；直接拉本次 run 的全部 artifact（含 blockmap 那个 zip）。
      # merge-multiple 保持不开，保留目录以便下一步查重名。
      - name: 下载全平台产物
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: 汇总待发布文件
        shell: bash
        run: |
          set -e
          mkdir -p release
          # Release 资产是**扁平**的，只认 basename。electron-builder 的产物名已带
          # version/arch（如 GWork-1.0.0-x86_64.AppImage），latest*.yml 也每平台一个，
          # 三平台之间不会撞名；但仍显式校验一次 —— 一旦哪天改了 artifactName 导致
          # 同名，静默覆盖会让用户下到错架构的包，比构建失败更难排查。
          dups="$(find artifacts -type f -printf '%f\n' | sort | uniq -d)"
          if [ -n "$dups" ]; then
            echo "::error::存在同名产物，扁平上传会互相覆盖："; echo "$dups"; exit 1
          fi
          find artifacts -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' \
            -o -name '*.deb' -o -name '*.blockmap' -o -name 'latest*.yml' \) \
            -exec cp {} release/ \;
          ls -lh release
          [ -n "$(ls -A release)" ] || { echo "::error::没有可发布的产物"; exit 1; }

      - name: 创建 Release 并上传资产
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # tag 触发时用 tag 名；手动发布时没有 tag，用输入的版本号拼出 v<version>，
          # 并用 --target 把 Release 绑定到当前 commit。
          if [ "$GITHUB_REF_TYPE" = tag ] && [ -n "$GITHUB_REF_NAME" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            V="${{ github.event.inputs.version }}"
            if [ -z "$V" ]; then
              echo "::error::手动发布需要填写版本号（version 输入框）"; exit 1
            fi
            TAG="v${V#v}"
          fi
          echo "目标 Release: $TAG"
          # Release 可能已由 Tauri 流水线（同 tag 触发）建好，此时直接复用。
          # create 与 view 之间存在竞态：两条流水线可能同时探测到「不存在」，
          # 后到者 create 会失败，故失败后再 view 一次确认确实已存在。
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes \
              || gh release view "$TAG"
          fi
          # --clobber：重跑流水线时覆盖同名旧资产，而不是报「已存在」中断
          gh release upload "$TAG" release/* --clobber
          echo "已发布到: $(gh release view "$TAG" --json url -q .url)"
