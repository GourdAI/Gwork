name: Desktop (Tauri) 多平台打包

# 与 build.yml（Electron 版）并列的 Tauri 版打包流水线。两者触发条件一致，
# 打同一个 v* tag 会同时产出两套安装包，产物用不同的 artifact 名区分。
#
# 与 Electron 版的关键差异：
#   1. 后端资源在**本模块自己的目录** gourd-ai-tauri/build/extraResources/。
#      2026-09-06 前它跨模块引用 gourd-ai-desktop/build/extraResources/，等于「打 Tauri 包
#      要先打 Electron 包」；现由 cmd/sync-backend.js 直接从 gourd-ai-agent/target 取 jar，
#      两个桌面壳互不依赖。
#   2. 多一条 Rust 工具链，且 Linux 需要 WebKitGTK 等系统库（Tauri 用系统 WebView，
#      不像 Electron 自带 Chromium）。
#   3. macOS 双架构靠 `tauri build --target <triple>` 交叉编译，而非 electron-builder 的
#      --x64/--arm64；两次构建落在不同的 target/<triple>/ 目录，互不覆盖。

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（留空则使用 tauri.conf.json 当前版本）'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            label: Windows (nsis x64)
          - os: macos-latest
            platform: mac
            label: macOS (dmg x64+arm64)
          # 固定 22.04 而非 ubuntu-latest：Tauri v2 需要 webkit2gtk-4.1，
          # 且低版本 glibc 能让 AppImage 覆盖更多发行版
          - os: ubuntu-22.04
            platform: linux
            label: Linux (AppImage/deb x64)
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17（Maven 编译 + jlink 生成内置 JRE）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 回归门禁：只读资源导致的 `build.rs ... Permission denied (os error 13)`。
      # jlink 的 legal/** 只读位只在 POSIX 产生，而开发机多为 Windows —— 这类
      # 「只在某平台炸」的问题正是本仓库反复踩坑的原因，所以不加 platform 条件，
      # **三条腿都跑**：Linux/macOS 腿验的是真 POSIX 权限位语义。
      # 零依赖（只用 node 内置模块），放在 Rust/Maven/jlink 等昂贵步骤之前，
      # 坏了几秒内当场红，不用等编译 4 分钟。
      - name: 回归测试（只读资源重复构建）
        shell: bash
        working-directory: gourd-ai-tauri
        run: node test/readonly-resource-repro.js

      # macOS 要出 x64 + arm64 两个 dmg，需预装两个 target；其余平台用默认宿主 target
      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'mac' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust 构建缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './gourd-ai-tauri/src-tauri -> target'

      # Tauri 在 Linux 用系统 WebView（webkit2gtk）而非自带 Chromium，这些是硬依赖：
      #   libwebkit2gtk-4.1-dev  Tauri v2 的 WebView（4.0 是 v1 的，不通用）
      #   libayatana-appindicator3-dev  托盘图标（Cargo features 开了 tray-icon）
      #   librsvg2-dev / patchelf / file  AppImage 打包链路
      #   libfuse2  AppImage 工具链的兜底：linuxdeploy 及其输出插件本身都是 AppImage。
      #     tauri-bundler 2.9+ 已同时传 --appimage-extract-and-run 和同名环境变量
      #     （PR #14241），正常不需要 FUSE；但 ubuntu-22.04 只预装 fuse3，一旦哪个
      #     子进程没继承到该变量就会退化成 FUSE 挂载并静默失败。装上一个包换掉整类
      #     故障，成本可忽略。注意 24.04 上该包已改名 libfuse2t64 —— 这也是本 job
      #     固定用 22.04 的原因之一。
      - name: 安装 Linux 系统依赖
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            file \
            libfuse2 \
            xdg-utils

      # 版本号来源与 Electron 版不同：Tauri 读 src-tauri/tauri.conf.json 的 version
      # （NSIS 升级链、dmg 文件名都取自它）。三处版本必须同步，否则 Cargo.toml 与
      # 配置漂移，后续排查产物版本会对不上。
      - name: 写入版本号
        shell: bash
        run: |
          set -e
          VERSION=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$VERSION" ]; then
            echo "未指定版本号，使用 tauri.conf.json 当前版本"
            exit 0
          fi
          echo "使用版本号: $VERSION"
          cd gourd-ai-tauri
          node cmd/set-version.js "$VERSION"
          grep -m1 '"version"' src-tauri/tauri.conf.json
          grep -m1 '^version' src-tauri/Cargo.toml

      # ── 后端产物：Maven 出 jar，jlink 出 JRE，落点是**本模块**的 build/extraResources/ ──

      # -Dgwork.build.revision：把 git 短 sha 写入 jar 内 build-info.properties（与 build.yml 保持一致）
      - name: Maven 构建后端 JAR
        shell: bash
        run: mvn -B -ntp -pl gourd-ai-agent -am package -DskipTests -Dgwork.build.revision=${GITHUB_SHA::7}

      # jar 的复制交给 cmd/sync-backend.js（beforeBuildCommand 里也会跑一次，幂等），
      # 保证 CI 与本地走**同一段逻辑**，不再出现「本地忘了复制 jar」这类分叉。
      # --jar-only：此刻 JRE 尚未生成（在下一步），不能做 JRE 校验，否则必败。
      - name: 同步后端 JAR 到 extraResources
        shell: bash
        working-directory: gourd-ai-tauri
        run: node cmd/sync-backend.js --jar-only

      # 模块清单与 build.ps1 / build.sh / build.yml / cmd/sync-backend.js 保持一致
      #
      # chmod -R u+w：jlink 会把 legal/** 设为只读（0444），这段逻辑在 JDK 的
      # DefaultImageBuilder 里被 supportsFileAttributeView(PosixFileAttributeView)
      # 包着，**只在 POSIX 生效**。而 tauri-build 的 copy_file 是裸 fs::copy（不像
      # 同文件的 copy_binaries 会先 remove_file(dest)），Unix 上 fs::copy 连源权限位
      # 一起复制 → target/release/extraResources/jre/legal/** 也成 0444 → **第二次**
      # tauri build 以 O_TRUNC 打开只读目标，报 Permission denied (os error 13)。
      # 本仓库 Linux 腿正好跑两次 tauri build（deb + AppImage）共用同一个 target/，
      # 必然命中；rust-cache 还会把带毒的 target/ 跨运行恢复，导致重跑也修不好。
      # 这里在源头去掉只读位，src-tauri/build.rs 另有一层清理 target/ 内既有副本。
      - name: 生成内置 JRE（Windows / Linux）
        if: matrix.platform != 'mac'
        shell: bash
        run: |
          set -e
          MODULES="java.base,java.logging,java.sql,java.naming,java.management,java.instrument,java.net.http,jdk.crypto.ec,jdk.zipfs,jdk.unsupported"
          JRE_DIR="gourd-ai-tauri/build/extraResources/jre"
          rm -rf "$JRE_DIR"
          "$JAVA_HOME/bin/jlink" --module-path "$JAVA_HOME/jmods" --add-modules "$MODULES" \
            --output "$JRE_DIR" --strip-debug --compress 2 --no-header-files --no-man-pages
          chmod -R u+w "$JRE_DIR"

      # macOS 需要同时出 x64 与 arm64 两个包：jlink 产物架构取决于 jmods，
      # 因此下载两种架构的 JDK，统一用本机 jlink 分别链接出两套 JRE。
      - name: 生成内置 JRE（macOS 双架构）
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          set -e
          MODULES="java.base,java.logging,java.sql,java.naming,java.management,java.instrument,java.net.http,jdk.crypto.ec,jdk.zipfs,jdk.unsupported"
          mkdir -p /tmp/jdk-x64 /tmp/jdk-arm64
          curl -fsSL -o /tmp/jdk-x64.tar.gz "https://api.adoptium.net/v3/binary/latest/17/ga/mac/x64/jdk/hotspot/normal/eclipse"
          curl -fsSL -o /tmp/jdk-arm64.tar.gz "https://api.adoptium.net/v3/binary/latest/17/ga/mac/aarch64/jdk/hotspot/normal/eclipse"
          tar -xzf /tmp/jdk-x64.tar.gz -C /tmp/jdk-x64 --strip-components=1
          tar -xzf /tmp/jdk-arm64.tar.gz -C /tmp/jdk-arm64 --strip-components=1
          X64_HOME="$(find /tmp/jdk-x64 -maxdepth 5 -name jmods -type d | head -n1 | sed 's|/jmods$||')"
          ARM_HOME="$(find /tmp/jdk-arm64 -maxdepth 5 -name jmods -type d | head -n1 | sed 's|/jmods$||')"
          echo "x64 JDK: $X64_HOME"
          echo "arm64 JDK: $ARM_HOME"
          OUT_X64="gourd-ai-tauri/build/jre-mac-x64"
          OUT_ARM="gourd-ai-tauri/build/jre-mac-arm64"
          rm -rf "$OUT_X64" "$OUT_ARM"
          "$JAVA_HOME/bin/jlink" --module-path "$X64_HOME/jmods" --add-modules "$MODULES" \
            --output "$OUT_X64" --strip-debug --compress 2 --no-header-files --no-man-pages
          "$JAVA_HOME/bin/jlink" --module-path "$ARM_HOME/jmods" --add-modules "$MODULES" \
            --output "$OUT_ARM" --strip-debug --compress 2 --no-header-files --no-man-pages
          # 保证可执行位（经压缩/解压或跨架构链接后可能丢失），否则包内 java 无法 spawn
          # u+w 见上一步注释：jlink 的 legal/** 只读位会经 fs::copy 传染到 target/，
          # 让第二次 tauri build 报 Permission denied (os error 13)。
          chmod -R u+w "$OUT_X64" "$OUT_ARM"
          chmod +x "$OUT_X64/bin/"* "$OUT_ARM/bin/"*

      # 只装 @tauri-apps/cli；ui/ 与 NSIS 位图由 tauri.conf.json 的 beforeBuildCommand
      # （prepare-ui.js + generate-nsis-assets.js）在 build 时现生成，无需入库
      - name: 安装前端依赖
        shell: bash
        working-directory: gourd-ai-tauri
        run: npm install

      # 决定本次构建是否产出更新包（.sig）由 npm scripts 的 preflight 步骤完成
      # （build:win / build:mac / build:linux 均已内联 configure-updater.js + -c overlay），
      # 无需在 CI 单独执行 —— 单独跑反而会与打包步骤的环境变量不一致：
      # 本步骤若拿不到 Secret 就会生成「禁用」overlay，而下一步打包却有私钥，
      # 结果是有钥却不签名。故这里不再单列，只保证打包步骤注入了私钥。

      - name: 打包（Windows nsis）
        if: matrix.platform == 'win'
        shell: bash
        working-directory: gourd-ai-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run build:win

      # ── Linux 拆两步：deb 先出，AppImage 后出 ──
      # 原来是一条 `--bundles appimage,deb`。tauri-bundler 的 bundle_project() 把
      # PackageType 按 priority 排序后**顺序执行、用 `?` 直接向上抛**；而 appimage 与
      # deb 的 priority 同为 0，sort_by_key 是稳定排序 → 实际顺序沿用 CLI 传入顺序，
      # 即 AppImage 先跑。AppImage 一挂，deb 连生成机会都没有，整条 Linux 腿零产物，
      # 上传步骤再撞上 if-no-files-found: error，二次报错把真因盖掉。拆开后 deb 必定
      # 先落盘（两者只各自清自己的 bundle/deb、bundle/appimage 子目录，互不覆盖）。
      - name: 打包（Linux deb）
        if: matrix.platform == 'linux'
        shell: bash
        working-directory: gourd-ai-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run build:linux:deb

      # AppImage 是两条 Linux 产物里唯一要联网拉工具、也唯一长期不稳定的一条。
      #   1. LD_LIBRARY_PATH —— **`Could not find dependency: libjvm.so` 的真因**。
      #      linuxdeploy 会递归扫 AppDir/usr/lib 下**所有** ELF 并逐个 ldd，而本项目
      #      整棵内置 JRE 正好落在 usr/lib/GWork/extraResources/jre/（bundle.resources
      #      经 deb data 目录进 AppDir，Tauri 固定放 usr/lib/<productName>/，改不掉）。
      #      JRE 的 lib/*.so（libnio.so、libnet.so、libjava.so…）都 NEEDED libjvm.so，
      #      但 libjvm.so 在**下一层** lib/server/ 里，而这些兄弟库的 RPATH 只有 $ORIGIN
      #      （= lib/，不含 server/）。运行期没问题 —— java 启动器按自己的 home 算出绝对
      #      路径 dlopen libjvm.so；可 ldd 只认标准路径 + RPATH + LD_LIBRARY_PATH，于是
      #      解析不到，linuxdeploy 硬失败（失败日志里两行紧挨着，因果很直白）：
      #        Deploying dependencies for ELF file .../jre/lib/libnio.so
      #        ERROR: Could not find dependency: libjvm.so
      #        ERROR: Failed to deploy dependencies for existing files
      #      把 JRE 自己的 lib/ 与 lib/server/ 喂给 LD_LIBRARY_PATH，ldd 即可解析。
      #      安全性：本项目 jlink 模块清单不含 java.desktop，这两个目录里只有 libjava /
      #      libnio / libzip / libjvm 等 JDK 私有库，**没有任何会遮蔽系统库的同名 so**；
      #      且变量只作用于本步骤，不会影响 cargo/rustc。
      #   2. NO_STRIP —— linuxdeploy 自带的 strip 是老 binutils，遇新 glibc 库的
      #      .relr.dyn 段会报 `unknown type [0x13] section`。注意：本仓库首次报
      #      `failed to run linuxdeploy` 时它**已经是开的**，所以它不是本例真因，
      #      保留只是因为它能排掉一类常见故障且无副作用。
      #   3. --verbose（写在 npm script 里）—— tauri-bundler 在日志级别为 Error（默认）
      #      时把 linuxdeploy 的 stdout/stderr **捕获后整份丢弃**，只剩一句没有内容的
      #      `failed to run linuxdeploy`；verbose 下才流式打印真错。判据很硬：报错带路径
      #      （`failed to run /…/linuxdeploy-x86_64.AppImage`）说明没被吞，不带路径的
      #      就是被吞了。上面第 1 条的真因正是靠它打出来的，必须保留。
      # tee 一份日志留作 artifact（Actions 日志有保留期且不便 grep）。GHA 的
      # `shell: bash` 自带 -eo pipefail，管道退出码取 npm 的，不会被 tee 掩盖。
      - name: 打包（Linux AppImage）
        id: linux-appimage
        if: matrix.platform == 'linux'
        shell: bash
        working-directory: gourd-ai-tauri
        env:
          # 指向**源** JRE（build/extraResources/jre）而非 AppDir 内的副本：本步骤开始时
          # AppDir 尚未生成，而源目录在「生成内置 JRE」步骤后必定存在，两者是同一份文件。
          LD_LIBRARY_PATH: ${{ github.workspace }}/gourd-ai-tauri/build/extraResources/jre/lib:${{ github.workspace }}/gourd-ai-tauri/build/extraResources/jre/lib/server
          NO_STRIP: 'true'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run build:linux:appimage 2>&1 | tee /tmp/appimage-build.log

      # AppImage 失败时补「现场」。verbose 已让 linuxdeploy 的输出进日志，但「它当时
      # 看到了哪些文件」只能从磁盘取。重点：JRE 确实会落进 usr/lib（已实测确认：
      # usr/lib/GWork/extraResources/jre/）—— linuxdeploy 会**递归**扫 usr/lib 下所有
      # ELF，逐个 ldd 并把 rpath 改写成 $ORIGIN。这正是 libjvm.so 解析失败的来源（见
      # 上一步 LD_LIBRARY_PATH 的注释），也是「包出来了但跑不起来」的典型风险点，
      # 所以这几项计数保留：万一后续又红，先看它们能快速分流。
      - name: 诊断（Linux AppImage 失败时）
        if: failure() && matrix.platform == 'linux' && steps.linux-appimage.outcome == 'failure'
        shell: bash
        working-directory: gourd-ai-tauri
        run: |
          echo "===== 已产出的 bundle ====="
          find src-tauri/target/release/bundle -maxdepth 2 -type f 2>/dev/null | sort || true
          echo
          # 注意：GHA 的 shell:bash 是 `bash -eo pipefail`（本次失败日志第 12 行实测）。
          # `find | sort | head -N` 里 head 提前退出会让 sort 收到 SIGPIPE 而返回 141，
          # 经 pipefail 传染 → **诊断步骤自己也会红**，把真错的日志尾巴截掉。
          # 所有以 head 收尾的管道一律补 `|| true`；wc 会读完输入，不需要。
          echo "===== AppDir 现场 ====="
          for d in src-tauri/target/release/bundle/appimage/*.AppDir; do
            [ -d "$d" ] || continue
            echo "--- $d 顶层 ---"
            find "$d" -maxdepth 2 2>/dev/null | sort | head -60 || true
            echo "--- usr/bin（linuxdeploy 非递归扫这里的可执行文件） ---"
            for f in "$d"/usr/bin/*; do
              [ -f "$f" ] || continue
              printf '%s -> ' "$f"; file -b "$f" 2>/dev/null || echo "(file 不可用)"
            done
            echo "--- usr/lib 递归文件总数 / 其中 .so 数 ---"
            find "$d/usr/lib" -type f 2>/dev/null | wc -l
            find "$d/usr/lib" -name '*.so*' 2>/dev/null | wc -l
            echo "--- usr/lib 内的 jre 目录（实测必存：它就是 libjvm.so 报错的导火索） ---"
            find "$d/usr/lib" -type d -name jre 2>/dev/null | head -5 || true
            echo "--- libjvm.so 实际位置（应在 jre/lib/server/，与兄弟库差一层目录） ---"
            find "$d/usr/lib" -name 'libjvm.so' 2>/dev/null | head -5 || true
            echo "--- JRE 在 usr/lib 下占多少文件（linuxdeploy 会逐个 ldd + 改写 rpath） ---"
            find "$d/usr/lib" -path '*/jre/*' -type f 2>/dev/null | wc -l
          done
          echo
          echo "===== LD_LIBRARY_PATH 是否指向真实存在的 JRE lib 目录 ====="
          # 上一步靠它让 ldd 能解析 libjvm.so；路径写错/JRE 未生成时会静默失效，
          # 表现与未设置完全一致，所以失败时必须把它当成首要嫌疑人核对。
          for p in build/extraResources/jre/lib build/extraResources/jre/lib/server; do
            printf '%s -> ' "$p"
            [ -d "$p" ] && echo "存在（so 数：$(find "$p" -maxdepth 1 -name '*.so' | wc -l)）" || echo "不存在！"
          done
          echo
          echo "===== 磁盘剩余（AppImage 要同时容纳 AppDir 与 squashfs） ====="
          df -h /home/runner /tmp 2>/dev/null || true

      # artifact 名刻意**不带** gwork-tauri- 前缀：manifest / release 两个 job 用
      # download-artifact 的 pattern: gwork-tauri-* 拉产物，同名前缀会把这份纯日志
      # 也拉进 artifacts/。虽然两个消费者的过滤条件都不认 .log（实际无害），但让
      # 诊断日志混进「待发布产物」目录属于自找麻烦，前缀错开最省事。
      - name: 上传 AppImage 失败日志
        if: failure() && matrix.platform == 'linux' && steps.linux-appimage.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: gwork-appimage-debug-log
          path: /tmp/appimage-build.log
          if-no-files-found: warn
          retention-days: 14

      # 分两次交叉编译：每次换入对应架构的 JRE，产物落在 target/<triple>/ 互不覆盖。
      # 签名：配置了 APPLE_CERTIFICATE 等 Secrets 时走 Developer ID 正式签名 + 公证；
      # 未配置时降级为 ad-hoc（APPLE_SIGNING_IDENTITY="-"）——Apple Silicon 要求
      # 至少 ad-hoc 签名才能执行，否则用户会遇到「文件已损坏」。
      - name: 打包（macOS dmg x64 + arm64）
        if: matrix.platform == 'mac'
        shell: bash
        working-directory: gourd-ai-tauri
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # 更新包签名（minisign）与上面的 Apple 代码签名是两套完全独立的机制：
          # 前者保证「更新内容未被篡改」，后者保证「macOS 肯运行这个 app」。缺一不可。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -e
          # Secret 未配置时 ${{ secrets.X }} 渲染为空串（而非未定义）。tauri-bundler 只看
          # var_os()「是否存在」，空串会被当成有效值：空的 APPLE_CERTIFICATE 会走证书导入
          # 并失败，空的 APPLE_ID 会触发 notarytool 调用后报错。必须先 unset 空值。
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                   APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!v}" ] || unset "$v"
          done
          if [ -n "${APPLE_CERTIFICATE:-}" ]; then
            echo "签名模式: Developer ID 正式签名${APPLE_ID:+ + 公证}"
          else
            export APPLE_SIGNING_IDENTITY="-"
            echo "签名模式: ad-hoc（未配置证书 Secrets）"
          fi
          JRE="build/extraResources/jre"
          for arch in x64:x86_64-apple-darwin arm64:aarch64-apple-darwin; do
            name="${arch%%:*}"
            triple="${arch##*:}"
            echo "=== 构建 macOS $name ($triple) ==="
            rm -rf "$JRE"
            cp -R "build/jre-mac-$name" "$JRE"
            # cp -R 会把只读位一并带过来；只读的 jre 会让下一个架构的 rm -rf 与
            # tauri-build 的 fs::copy 同时遭殃（见生成 JRE 步骤的 os error 13 注释）
            chmod -R u+w "$JRE"
            chmod +x "$JRE/bin/"*
            npm run build:mac -- --target "$triple"
          done

      # 校验签名与资源密封：包内嵌了整个 JRE，任何一处密封失败都会让用户拿到「已损坏」的包
      - name: 校验 macOS 签名
        if: matrix.platform == 'mac'
        shell: bash
        working-directory: gourd-ai-tauri
        run: |
          set -e
          for app in src-tauri/target/*/release/bundle/macos/*.app; do
            [ -d "$app" ] || continue
            echo "校验: $app"
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dv --verbose=2 "$app" 2>&1 | grep -E "Authority|Signature=|TeamIdentifier" || true
          done

      # macOS 的两个架构产物同名（都叫 GWork.app.tar.gz，只是 triple 目录不同），
      # 而 upload-artifact 会拍平目录结构 → 同名文件互相覆盖，arm64 的包会把 x64 的盖掉，
      # 而 .sig 却来自另一个架构 → 签名校验必败。故先按架构改名归集到 staging/。
      - name: 归集产物（macOS 双架构防同名覆盖）
        if: matrix.platform == 'mac'
        shell: bash
        working-directory: gourd-ai-tauri
        run: |
          set -e
          mkdir -p staging
          for triple in x86_64-apple-darwin aarch64-apple-darwin; do
            arch="x64"; [ "$triple" = "aarch64-apple-darwin" ] && arch="arm64"
            b="src-tauri/target/$triple/release/bundle"
            [ -d "$b" ] || continue
            mkdir -p "staging/$arch"
            find "$b" -maxdepth 3 \( -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' \) \
              -exec cp {} "staging/$arch/" \;
          done
          find staging -type f | sort

      # !cancelled() 而非默认的成功才跑：Linux 腿现在 deb 与 AppImage 分两步，
      # AppImage 失败时 deb 已经落盘，必须让它进 artifact —— 否则 manifest / release
      # 两个 job 拿到的 Linux 产物是空的，比「少一个 AppImage」糟得多。
      # if-no-files-found 保持 error：成功路径上它仍是有用的护栏（防 path 写错静默零产物）。
      - name: 上传安装包
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: gwork-tauri-${{ matrix.platform }}
          # 不带 --target 时产物在 target/release/bundle/；带 --target（macOS）时已由上一步
          # 归集到 staging/<arch>/。.sig 必须随包上传 —— latest.json 的 signature 字段
          # 就是它的内容，丢了就无法生成清单。
          path: |
            gourd-ai-tauri/src-tauri/target/release/bundle/nsis/*.exe
            gourd-ai-tauri/src-tauri/target/release/bundle/nsis/*.exe.sig
            gourd-ai-tauri/src-tauri/target/release/bundle/appimage/*.AppImage
            gourd-ai-tauri/src-tauri/target/release/bundle/appimage/*.AppImage.sig
            gourd-ai-tauri/src-tauri/target/release/bundle/deb/*.deb
            gourd-ai-tauri/staging/**
          if-no-files-found: error

  # 三个平台全部构完后汇总：tauri-plugin-updater 用的是**单个** latest.json，
  # 内部 platforms 映射覆盖全平台（不像 electron-updater 每平台一个 yml），
  # 所以必须等所有平台的 .sig 齐了才能生成。
  manifest:
    name: 生成更新清单 latest.json
    needs: build
    # fail-fast: false 下允许部分平台失败；此时仍给成功的平台出清单，
    # 比整个发布卡住强（缺的平台重跑后重新生成即可）。
    if: always() && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 下载全平台产物
        uses: actions/download-artifact@v4
        with:
          pattern: gwork-tauri-*
          path: artifacts

      - name: 生成 latest.json
        shell: bash
        working-directory: gourd-ai-tauri
        run: |
          set -e
          VERSION=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          ARGS=(--artifacts ../artifacts --out ../latest.json)
          [ -n "$VERSION" ] && ARGS+=(--version "$VERSION")
          # 未配置签名密钥时本步会因「无任何带签名载荷」而非零退出，这是预期的：
          # 宁可不产出清单，也不能产出一个缺签名、客户端装不上的清单。
          node cmd/generate-latest-json.js "${ARGS[@]}" || {
            echo "::warning::未生成 latest.json（通常是未配置 TAURI_SIGNING_PRIVATE_KEY）"
            exit 0
          }
          cat ../latest.json

      - name: 上传 latest.json
        if: hashFiles('latest.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: gwork-tauri-latest-json
          path: latest.json
          if-no-files-found: error

  # 打 v* tag 时把全平台产物 + latest.json 发布到同名 GitHub Release。
  # 在此之前产物只存在于 Actions artifact（保留期有限、需登录才能下载），
  # Release 页面始终为空。与 build.yml 的 release job 同构，两者写入同一个 Release。
  release:
    name: 发布到 GitHub Release
    needs: [build, manifest]
    # manifest 在未配置签名密钥时也会「成功但不产出 latest.json」，故用 always()
    # 兼容部分失败；发布已成功的平台比整个发版卡住强。
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 创建 Release、上传资产所需（默认 token 只读）
    steps:
      # 不用 merge-multiple：macOS 两个架构的更新载荷同名（都叫 GWork.app.tar.gz），
      # 合并时会直接互相覆盖。保留目录结构，下一步按路径里的架构改名。
      - name: 下载全平台产物
        uses: actions/download-artifact@v4
        with:
          pattern: gwork-tauri-*
          path: artifacts

      - name: 汇总待发布文件（macOS 双架构按架构改名）
        shell: bash
        run: |
          set -e
          mkdir -p release
          # Release 资产是扁平的，只认 basename。dmg/exe/AppImage/deb 的文件名已带
          # version+arch，扁平后唯一；但 .app.tar.gz（及其 .sig）两个架构同名，
          # 架构信息只在目录名里，必须改名后再上传，否则 x64 会被 arm64 盖掉，
          # 而用户拿到的包与 latest.json 里的签名对不上 —— 此命名与
          # cmd/publish-downloads.js 的固定名约定（GWork-{x64,arm64}.app.tar.gz）一致。
          while IFS= read -r f; do
            base="$(basename "$f")"
            case "$f" in
              *.app.tar.gz|*.app.tar.gz.sig)
                arch=x64
                case "$f" in *aarch64*|*arm64*) arch=arm64 ;; esac
                base="${base/GWork.app.tar.gz/GWork-$arch.app.tar.gz}"
                ;;
            esac
            if [ -e "release/$base" ]; then
              echo "::error::同名产物冲突，上传会互相覆盖: $base ($f)"; exit 1
            fi
            cp "$f" "release/$base"
          done < <(find artifacts -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' \
            -o -name '*.deb' -o -name '*.sig' -o -name '*.app.tar.gz' -o -name 'latest.json' \) | sort)
          ls -lh release
          [ -n "$(ls -A release)" ] || { echo "::error::没有可发布的产物"; exit 1; }

      - name: 创建 Release 并上传资产
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="$GITHUB_REF_NAME"
          # Release 可能已由 build.yml（同 tag 触发）建好，直接复用；
          # 两条流水线可能同时探测到「不存在」，后到者 create 会失败，
          # 故失败后再 view 一次确认确实已存在。
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes \
              || gh release view "$TAG" >/dev/null
          fi
          gh release upload "$TAG" release/* --clobber
          echo "已发布到: $(gh release view "$TAG" --json url -q .url)"
