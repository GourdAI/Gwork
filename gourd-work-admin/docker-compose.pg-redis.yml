# 本地全栈部署：修改后的源码构建 + PostgreSQL + Redis
#
# 启动：docker compose -f docker-compose.pg-redis.yml up -d --build
# 停止：docker compose -f docker-compose.pg-redis.yml down
# 日志：docker compose -f docker-compose.pg-redis.yml logs -f
# 访问：http://localhost:3000 （首次进入完成初始化向导创建管理员）
#
# 与仓库 docker-compose.yml 的区别：app 服务由 image: calciumion/new-api:latest
# 改为 build: . + Dockerfile.local，确保运行的是本地修改过的源码（含 installers 功能）。
# 数据库/缓存连接串沿用仓库官方配置。

services:
  gourd-work-admin:
    build:
      context: .
      dockerfile: Dockerfile.local
    image: gourd-work-admin:local
    container_name: gourd-work-admin
    restart: unless-stopped
    command: --log-dir /app/logs
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      - SQL_DSN=postgresql://root:123456@postgres:5432/new-api
      - REDIS_CONN_STRING=redis://:123456@redis:6379
      - TZ=Asia/Shanghai
      - ERROR_LOG_ENABLED=true
      - BATCH_UPDATE_ENABLED=true
      - NODE_NAME=gourd-work-admin-local
      - DEFAULT_LANGUAGE=zh-CN
      - SESSION_COOKIE_SECURE=false
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - gourd-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  redis:
    image: redis:latest
    container_name: gourd-work-admin-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "123456"]
    networks:
      - gourd-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a 123456 ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:15
    container_name: gourd-work-admin-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: new-api
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - gourd-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d new-api"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pg_data:

networks:
  gourd-net:
    driver: bridge
