[workspace]
resolver = "2"
members = [
    "core",
    "cli",
    "desktop/src-tauri",
]

[workspace.package]
version = "0.3.0"
authors = ["gourdai"]
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.77.2"

[workspace.dependencies]
# ─── 异步运行时与 HTTP ───────────────────────────────────────────
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws", "multipart"] }
tower-http = { version = "0.5", features = ["fs", "trace", "cors"] }
tower = "0.5"
# 网页抓取成功率：开启自动内容协商与解压（gzip/br/deflate）、HTTP/2、系统代理。
# default-features=false 曾把 reqwest 默认的 charset/http2/system-proxy 一起关掉，
# 导致 CDN/现代站点要么无法协商压缩、要么返回压缩字节被当作正文解码成乱码；
# 且大量站点只走 h2，关掉 http2 会退化到 h1 甚至被拒。这里显式补回成功率相关项。
#
# system-proxy 是「零配置跟随本机网络」的编译期前提，不做任何设置页：
# reqwest 的 auto_sys_proxy 在 ClientBuilder::build() 时构造 ProxyMatcher::system()
# （reqwest client.rs:419），后者调 hyper-util 的 Matcher::from_system()，在 Windows
# 下由 client-proxy-system feature 门控的 win::with_system 读注册表
# HKCU\...\Internet Settings 的 ProxyEnable/ProxyServer/ProxyOverride
# （hyper-util matcher.rs:238-249, 695-722）。缺这个 feature 时 from_system() 退化成
# 只读 HTTP_PROXY/HTTPS_PROXY/ALL_PROXY 环境变量，于是「浏览器走系统代理能访问、
# 工具纯直连连不上」——代理软件（Clash/v2ray 等）在系统代理模式只写注册表。
# 【归因修正 2026-11，二次 codereview】此前误以为「桌面端由
# tauri-plugin-updater(reqwest 0.13) 通过 feature 统一把 0.12 的 system-proxy
# 也打开了」。精确机制是：Cargo 只对「同一 package 的同一版本」统一 feature，
# Cargo.lock 里 reqwest 0.12.28 与 0.13.5 是两个独立编译单元，0.13 的 feature
# 不会加到 0.12 上；但二者**共享唯一一份 hyper-util 0.1.21**，而两版 reqwest 的
# system-proxy 都定义为 hyper-util/client-proxy-system。桌面构建同时链接
# tauri-plugin-updater 2.14.1（default 含 system-proxy → reqwest 0.13）与 0.12，
# 于是该构建图里那份共享 hyper-util 的 client-proxy-system 被激活，0.12 的
# auto_sys_proxy 也就编译进了 win::with_system()。单独 -p gourd-work-cli 构建
# 没有 0.13 链，hyper-util 不带该 feature，from_system() 只剩环境变量；
# 但 --workspace / 多 -p 构建会把该 feature 一并统一到 CLI 所链接的 hyper-util，
# 所以差异只在「分离 cargo 调用」时存在。这里显式声明 system-proxy，是为了让
# reqwest 0.12 自身确定具备该能力，不再依赖桌面链是否恰好拉起 0.13、也不依赖
# 构建时选了哪些 -p（cargo tree -e features -i reqwest@0.12.28 已确认生效）。
# socks 仍不开：系统代理的 ProxyServer 不会是 socks scheme，显式 socks5:// 属于
# 「配置」；reqwest 0.12 的 socks = [] 是空 feature，不会引入 tokio-socks（旧注释
# 说的「会引入依赖」是 0.11 时代行为，已纠正，Cargo.lock 中亦无该包）。
# 已知边界：win::with_system 不解析 AutoConfigURL（PAC/WPAD），只覆盖固定
# ProxyServer 的系统代理模式；且 from_env() 优先，陈旧的 HTTP_PROXY 环境变量
# 会压过当前注册表值。default-tls 仍不开（0.12 的 default-tls 是 native-tls）。
# charset 只作用于 resp.text()，bytes_stream 路径的解码由
# core/src/tools/web.rs::read_body_capped 按 Content-Type 自行完成。
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls", "charset", "http2", "gzip", "brotli", "deflate", "system-proxy"], default-features = false }
futures-util = "0.3"
async-trait = "0.1"
tokio-util = "0.7"

# ─── 序列化与错误 ────────────────────────────────────────────────
serde = { version = "1", features = ["derive"] }
# preserve_order 是**必需**的，不是优化：serde_json 的 Map 默认是 BTreeMap，
# 序列化时按 key 字母序输出。settings.json 的 models 段必须保持「同 provider
# 连续」的插入序（前端 model-selector.js 按「provider 与上一项不同」分组），
# 且该文件与 Java 内核（LinkedHashMap，保序）共享。不开这个 feature，Rust 每
# 保存一次就把 236 个模型重排成字母序，选择器分组随之碎裂成上百个交替组头。
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
thiserror = "1"

# ─── 日志 ────────────────────────────────────────────────────────
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ─── 文件系统与文本 ──────────────────────────────────────────────
walkdir = "2"
regex = "1"
glob = "0.3"
# ripgrep 的目录遍历 crate：.gitignore 感知。钉住 0.4.30——更新的 0.4.x
# 抬高了 MSRV，与本工作区 rust-version 1.77.2 冲突。
ignore = "=0.4.30"
dirs = "5"
encoding_rs = "0.8"

# ─── 工具类 ──────────────────────────────────────────────────────
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
url = "2"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
# 桌面端登录密码传输加密（对齐 gourd-work-admin 的 v2 信封：
# RSA-OAEP(SHA-256, label="password-v2") 包裹 AES-256 密钥 + AES-GCM 密文）。
# 版本与 Cargo.lock 已解析版本一致，避免 MSRV/依赖漂移。
rsa = "0.9"
aes-gcm = "0.10"
pem = "3"
once_cell = "1"
mime_guess = "2"
cron = "0.12"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
# Filesystem watching for the editor's "changed on disk" reload (filer/watch).
notify = "6"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
