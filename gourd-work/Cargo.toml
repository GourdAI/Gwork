[workspace]
resolver = "2"
members = [
    "core",
    "cli",
    "desktop/src-tauri",
]

[workspace.package]
version = "0.3.0"
authors = ["gourdai"]
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.77.2"

[workspace.dependencies]
# ─── 异步运行时与 HTTP ───────────────────────────────────────────
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws", "multipart"] }
tower-http = { version = "0.5", features = ["fs", "trace", "cors"] }
tower = "0.5"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
futures-util = "0.3"
async-trait = "0.1"
tokio-util = "0.7"

# ─── 序列化与错误 ────────────────────────────────────────────────
serde = { version = "1", features = ["derive"] }
# preserve_order 是**必需**的，不是优化：serde_json 的 Map 默认是 BTreeMap，
# 序列化时按 key 字母序输出。settings.json 的 models 段必须保持「同 provider
# 连续」的插入序（前端 model-selector.js 按「provider 与上一项不同」分组），
# 且该文件与 Java 内核（LinkedHashMap，保序）共享。不开这个 feature，Rust 每
# 保存一次就把 236 个模型重排成字母序，选择器分组随之碎裂成上百个交替组头。
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
thiserror = "1"

# ─── 日志 ────────────────────────────────────────────────────────
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ─── 文件系统与文本 ──────────────────────────────────────────────
walkdir = "2"
regex = "1"
glob = "0.3"
dirs = "5"
encoding_rs = "0.8"

# ─── 工具类 ──────────────────────────────────────────────────────
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
url = "2"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
once_cell = "1"
mime_guess = "2"
cron = "0.12"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
# Filesystem watching for the editor's "changed on disk" reload (filer/watch).
notify = "6"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
