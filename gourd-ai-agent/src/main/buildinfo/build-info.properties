# Build fingerprint for the executable jar (self-identification).
#
# This file is deliberately OUTSIDE src/main/resources. pom.xml enables resource
# filtering for this directory only, so the placeholders below are replaced at
# build time and the result lands at classpath root: /build-info.properties.
# Filtering src/main/resources as a whole would corrupt binary assets under
# static/ and would eat Solon runtime placeholders inside app.yml.
#
# Purpose: if a desktop overwrite-install silently failed (old jar still held by
# a running process), the frontend can prove via /web/chat/meta (buildId / buildTime)
# that the running backend and the desktop shell are NOT from the same build.
#
# build.version is display/comparison only and must never be merged into
# AgentFlags.getVersion(), which is date-parsed by update detection.
#
# build.time is Maven's ISO-8601 UTC timestamp. See pom.xml (properties block)
# for why maven.build.timestamp.format is intentionally not declared here.
#
build.version=${project.version}
build.time=${maven.build.timestamp}
build.revision=${gwork.build.revision}
build.id=${project.version}-${maven.build.timestamp}-${gwork.build.revision}
