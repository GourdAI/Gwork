<!-- settings.html — 设置面板片段（设置浮层，body 级 position:fixed 全屏覆盖）。 -->
<template data-mount="body">
<!-- Settings Overlay (放在 body 最外层，确保 position:fixed 覆盖全屏) -->
<div class="settings-overlay" id="settingsOverlay" style="display:none">
    <div class="settings-panel">
        <button class="settings-close-btn" id="settingsCloseBtn" type="button" data-i18n-title="settings.common.close">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
        <div class="settings-content">
            <div class="settings-tabs">
                <div class="settings-tabs-title-row">
                    <div class="settings-tabs-title" data-i18n="settings.title">设置</div>
                </div>
                <button class="settings-tab active" data-tab="general"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg> <span data-i18n="settings.tabs.general">通用设置</span></button>
                <button class="settings-tab" data-tab="permission"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg> <span data-i18n="settings.tabs.permission">工具权限</span></button>
                
                <button class="settings-tab" data-tab="mounts"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg> <span data-i18n="settings.tabs.mounts">挂载空间</span></button>
                <button class="settings-tab" data-tab="mcp"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 19a1 1 0 0 1-1-1v-2a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2a1 1 0 0 1-1 1z"/><path d="M17 21v-2"/><path d="M19 14V6.5a1 1 0 0 0-7 0v11a1 1 0 0 1-7 0V10"/><path d="M21 21v-2"/><path d="M3 5V3"/><path d="M4 10a2 2 0 0 1-2-2V6a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2a2 2 0 0 1-2 2z"/><path d="M7 5V3"/></svg> <span data-i18n="settings.tabs.mcp">MCP配置</span></button>
                <button class="settings-tab" data-tab="openapi"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg> <span data-i18n="settings.tabs.openapi">接口配置</span></button>
                <button class="settings-tab" data-tab="lsp"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg> <span data-i18n="settings.tabs.lsp">LSP配置</span></button>
       <button class="settings-tab" data-tab="acp"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 18l6-6-6-6"/><path d="M8 6l-6 6 6 6"/><path d="M12 4v16"/></svg> <span data-i18n="settings.tabs.acp">ACP配置</span></button>
                <button class="settings-tab" data-tab="about"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg> <span data-i18n="settings.tabs.about">关于</span></button>

                
            </div>
            <div class="settings-body">
                <!-- General Tab -->
                <div class="settings-tab-content active" id="settingsTabGeneral">
                    <div class="settings-section">
                        <div class="settings-section-header">
                            <div>
                                <span class="settings-section-title" data-i18n="settings.general.title">通用</span>
                                <div class="settings-section-desc" data-i18n="settings.general.desc">全局运行参数，影响所有对话与工具行为</div>
                            </div>
                        </div>

                        <div class="general-card-group">
                            <!-- 外观 -->
                            <div class="general-card">
                                <div class="general-card-header">
                                    <div class="general-card-text">
                                        <div class="general-card-title" data-i18n="settings.general.appearance.title">外观</div>
                                    </div>
                                </div>
                                 <div class="general-card-body">
                                     <div class="general-toggle-row">
                                         <div class="general-toggle-info">
                                             <span class="general-toggle-name" data-i18n="settings.general.appearance.theme_name">主题颜色</span>
                                             <span class="general-toggle-desc" data-i18n="settings.general.appearance.theme_desc">切换界面主题为深色或浅色</span>
                                         </div>
                                         <label class="toggle-switch">
                                             <input type="checkbox" id="generalDarkMode"/>
                                             <span class="toggle-slider"></span>
                                         </label>
                                     </div>
                                      <div class="general-toggle-row settings-gap-top-md">
                                          <div class="general-toggle-info">
                                              <span class="general-toggle-name" data-i18n="settings.general.language.name">界面语言</span>
                                              <span class="general-toggle-desc" data-i18n="settings.general.language.desc">选择界面显示语言，修改后刷新页面生效</span>
                                          </div>
                                           <div class="layui-form general-locale-select">
                                                <select id="generalLocale" lay-filter="generalLocale">

                                                   <option value="zh-CN">🇨🇳 中文</option>
                                                   <option value="zh-TW">🇭🇰 中文（繁体）</option>
                                                   <option value="en">🇺🇸 English</option>
                                                   <option value="de">🇩🇪 Deutsch</option>
                                                   <option value="ja">🇯🇵 日本語</option>
                                                   <option value="ru">🇷🇺 Русский</option>
                                                   <option value="el">🇬🇷 Ελληνικά</option>
                                                   <option value="es">🇪🇸 Español</option>
                                                   <option value="fr">🇫🇷 Français</option>
                                                   <option value="pt">🇵🇹 Português</option>
                                                   <option value="ro">🇷🇴 Română</option>
                                                   <option value="vi">🇻🇳 Tiếng Việt</option>
                                               </select>
                                           </div>
                                      </div>
                                 </div>
                            </div>

                            <!-- 上下文压缩策略 -->
                            <div class="general-card">
                                <div class="general-card-header">
                                        <div class="general-card-text">
                                        <div class="general-card-title" data-i18n="settings.general.conversation.title">对话策略</div>
                                    </div>
                                </div>
                                <div class="general-card-body">
                                    <div class="general-field-row">
                                        <div class="general-field">
                                            <label class="general-field-label" data-i18n="settings.general.conversation.history_window">历史窗口大小</label>
                                            <input type="number" class="general-input" id="generalHistoryWindowSize" placeholder="默认 30" data-i18n-placeholder="settings.general.conversation.history_window_placeholder"/>
                                        </div>
                                        <div class="general-field">
                                            <label class="general-field-label" data-i18n="settings.general.conversation.compression_ratio">压缩触发比例(%)</label>
                                            <input type="number" min="1" max="100" class="general-input" id="generalCompressionRatio" placeholder="默认 80" data-i18n-placeholder="settings.general.conversation.compression_ratio_placeholder"/>
                                        </div>
                                    </div>
                                    <div class="general-toggle-desc settings-gap-top-sm" data-i18n="settings.general.conversation.hint">历史窗口：压缩时始终保护最后多少条消息完整不压缩；压缩触发比例：上下文占用达到「模型窗口 × 该比例%」时，自动把中间执行过程压缩为摘要（原始意图与最后 N 条完整保留）</div>
                                </div>
                            </div>

                            <!-- 沙盒模式 -->
                            <div class="general-card">
                                <div class="general-card-header">
                                        <div class="general-card-text">
                                        <div class="general-card-title" data-i18n="settings.general.sandbox.title">沙盒模式</div>
                                    </div>
                                </div>
                                <div class="general-card-body">
                                    <div class="general-toggle-row">
                                        <div class="general-toggle-info">
                                            <span class="general-toggle-desc" data-i18n="settings.general.sandbox.desc">AI 执行的命令将在受限沙盒环境中运行（只能读写'工作区'和'挂载'内的文件）</span>
                                        </div>
                                        <label class="toggle-switch">
                                            <input type="checkbox" id="generalSandboxMode"/>
                                            <span class="toggle-slider"></span>
                                        </label>
                                    </div>
                                    <div class="general-toggle-row settings-gap-top-md">
                                        <div class="general-toggle-info">
                                            <span class="general-toggle-desc" data-i18n="settings.general.sandbox.allow_home">在沙盒中允许访问用户主目录（`~/` 目录，如：`~/.m2`）</span>
                                        </div>
                                        <label class="toggle-switch">
                                            <input type="checkbox" id="generalSandboxAllowUserHome"/>
                                            <span class="toggle-slider"></span>
                                        </label>
                                    </div>
                                    <div class="general-toggle-row settings-gap-top-md">
                                        <div class="general-toggle-info">
                                            <span class="general-toggle-desc" data-i18n="settings.general.sandbox.system_restrict">采用更严格的系统内核级沙盒限制；关闭则放宽限制（测试）</span>
                                        </div>
                                        <label class="toggle-switch">
                                            <input type="checkbox" id="generalSandboxSystemRestrict"/>
                                            <span class="toggle-slider"></span>
                                        </label>
                                    </div>
                                </div>
                            </div>



                            <!-- 失败重试 -->
                            <div class="general-card">
                                <div class="general-card-header">
                                    <div class="general-card-text">
                                        <div class="general-card-title" data-i18n="settings.general.retry.title">失败重试</div>
                                    </div>
                                </div>
                                <div class="general-card-body">
                                    <div class="general-field-row">
                                        <div class="general-field">
                                            <label class="general-field-label" data-i18n="settings.general.retry.model_retries">模型重试次数</label>
                                            <input type="number" class="general-input" id="generalModelRetries" placeholder="默认 3" data-i18n-placeholder="settings.general.retry.retries_placeholder"/>
                                        </div>
                                        <div class="general-field">
                                            <label class="general-field-label" data-i18n="settings.general.retry.mcp_retries">MCP 重试次数</label>
                                            <input type="number" class="general-input" id="generalMcpRetries" placeholder="默认 3" data-i18n-placeholder="settings.general.retry.retries_placeholder"/>
                                        </div>
                                        <div class="general-field">
                                            <label class="general-field-label" data-i18n="settings.general.retry.api_retries">OpenAPI 重试次数</label>
                                            <input type="number" class="general-input" id="generalApiRetries" placeholder="默认 3" data-i18n-placeholder="settings.general.retry.retries_placeholder"/>
                                        </div>
                                    </div>
                                    <div class="general-toggle-desc settings-gap-top-sm" data-i18n="settings.general.retry.hint">控制各类请求失败后的自动重试次数</div>
                                </div>
                            </div>

                            <!-- 界面效果 -->
                            <div class="general-card">
                                <div class="general-card-header">
                                    <div class="general-card-text">
                                        <div class="general-card-title" data-i18n="settings.general.ui.title">界面效果</div>
                                    </div>
                                </div>
                                <div class="general-card-body">
                                    <div class="general-toggle-row">
                                        <div class="general-toggle-info">
                                            <span class="general-toggle-name" data-i18n="settings.general.ui.simplified_name">工具调用显示简化（或者收起）</span>
                                            <span class="general-toggle-desc" data-i18n="settings.general.ui.simplified_desc">开启后工具调用输出更简洁；关闭则展示完整的详细信息</span>
                                        </div>
                                        <label class="toggle-switch">
                                            <input type="checkbox" id="generalCliPrintSimplified"/>
                                            <span class="toggle-slider"></span>
                                        </label>
                                    </div>
                                </div>
                            </div>

                            <!-- 功能开关 -->
                            <div class="general-card">
                                <div class="general-card-header">
                                    <div class="general-card-text">
                                        <div class="general-card-title" data-i18n="settings.general.features.title">功能开关</div>
                                    </div>
                                </div>
                                 <div class="general-card-body">
                                     <div class="general-toggle-row settings-gap-top-md">
                                         <div class="general-toggle-info">
                                             <span class="general-toggle-name" data-i18n="settings.general.features.subagent_name">Subagent 子代理机制</span>
                                            <span class="general-toggle-desc" data-i18n="settings.general.features.subagent_desc">开启后可支持 Subagent 子代理机制，允许委派任务给专项子代理；关闭可减少上下文消耗</span>
                                        </div>
                                        <label class="toggle-switch">
                                            <input type="checkbox" id="generalSubagentEnabled"/>
                                            <span class="toggle-slider"></span>
                                        </label>
                                    </div>
                                    <div class="general-toggle-row settings-gap-top-md">
                                        <div class="general-toggle-info">
                                            <span class="general-toggle-name" data-i18n="settings.general.features.mcp_name">MCP 工具网关</span>
                                            <span class="general-toggle-desc" data-i18n="settings.general.features.mcp_desc">开启后可连接外部 MCP 服务，扩展 AI 的工具调用能力；关闭可减少上下文消耗</span>
                                        </div>
                                        <label class="toggle-switch">
                                            <input type="checkbox" id="generalMcpEnabled"/>
                                            <span class="toggle-slider"></span>
                                        </label>
                                    </div>
                                    <div class="general-toggle-row settings-gap-top-md">
                                        <div class="general-toggle-info">
                                            <span class="general-toggle-name" data-i18n="settings.general.features.openapi_name">OpenAPI 接口网关</span>
                                            <span class="general-toggle-desc" data-i18n="settings.general.features.openapi_desc">开启后可调用 OpenAPI/Swagger 接口，扩展 AI 的数据访问能力；关闭可减少上下文消耗</span>
                                        </div>
                                        <label class="toggle-switch">
                                            <input type="checkbox" id="generalOpenApiEnabled"/>
                                            <span class="toggle-slider"></span>
                                        </label>
                                    </div>
                                    <div class="general-toggle-row settings-gap-top-md">
                                        <div class="general-toggle-info">
                                            <span class="general-toggle-name" data-i18n="settings.general.features.lsp_name">LSP 代码智能</span>
                                            <span class="general-toggle-desc" data-i18n="settings.general.features.lsp_desc">开启后提供代码补全、定义跳转等语言服务；关闭可减少上下文消耗</span>
                                        </div>
                                        <label class="toggle-switch">
                                            <input type="checkbox" id="generalLspEnabled"/>
                                            <span class="toggle-slider"></span>
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
                <!-- Permission Tab -->
                <div class="settings-tab-content" id="settingsTabPermission">
                    <div class="settings-section">
                        <div class="settings-section-header">
                            <div>
                                <span class="settings-section-title" data-i18n="settings.permission.title">工具权限</span>
                                <div class="settings-section-desc" data-i18n="settings.permission.desc">管理全局工具访问权限，默认启用所有工具，可勾选禁用特定工具</div>
                            </div>
                        </div>

                        <div class="permission-container">

                            <!-- 工具列表 -->
                            <div class="permission-tools-list" id="permissionToolsList"></div>

                            <!-- 高级模式已移除 -->
                        </div>

                        <div class="form-actions form-actions-end settings-actions-spacious">
                            <button class="btn-primary" id="permissionSaveBtn" data-i18n="settings.save">保存</button>
                        </div>
                    </div>
                </div>
                <!-- MountPools Tab -->
                <div class="settings-tab-content" id="settingsTabMounts">
                    <!-- Pool List View -->
                    <div class="settings-view settings-view-list" id="mountsListView">
                        <div class="settings-section">
                            <div class="settings-section-header">
                                <div>
                                    <span class="settings-section-title" data-i18n="settings.mounts.title">挂载空间</span>
                                    <div class="settings-section-desc" data-i18n="settings.mounts.desc">管理本地目录映射，为 AI 提供技能与资源的加载路径</div>
                                </div>
                                <button class="settings-add-btn" id="mountsAddBtn" data-i18n="settings.mounts.add">+ 添加挂载</button>
                            </div>
                            <div class="mounts-list" id="mountsList"></div>
                        </div>
                    </div>
                    <!-- Pool Add Form View -->
                    <div class="settings-view settings-view-form" id="mountsFormView" style="display:none">
                        <div class="settings-section">
                            <div class="settings-section-header">
                                <div class="settings-title-row">
                                    <button class="settings-back-btn" id="mountsBackBtn" data-i18n-title="settings.common.back"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></button>
                                    <span class="settings-section-title" id="mountsFormTitle" data-i18n="settings.mounts.add_title">添加挂载</span>
                                </div>
                                <div class="settings-form-actions" id="mountsFormActions" style="display:none">
                                    <button class="settings-form-action-btn danger" id="mountsFormDeleteBtn" data-i18n-title="settings.common.delete"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg> <span data-i18n="settings.common.delete">删除</span></button>
                                </div>
                            </div>
                            <div class="mounts-add-form">
                                <div class="form-group">
                                    <label data-i18n="settings.mounts.alias_label">名称 <span class="required">*</span></label>
                                    <input type="text" id="mountsAlias" placeholder="@my-mount" data-i18n-placeholder="settings.mounts.alias_placeholder"/>
                                </div>
                                <div class="form-group">
                                    <label data-i18n="settings.mounts.scope_label">作用域</label>
                                    <input type="hidden" id="mountsScope" value="user"/>
                                    <div class="settings-scope-toggle" data-target="mountsScope">
                                        <button class="settings-scope-btn active" data-scope="user" type="button" data-i18n="settings.general.scope_user">用户（全局）</button>
                                        <button class="settings-scope-btn" data-scope="workspace" type="button" data-i18n="settings.general.scope_workspace">工作区（本地）</button>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label data-i18n="settings.mounts.type_label">内容类型</label>
                                    <div class="mcp-type-toggle" id="mountsTypeToggle">
                                        <button class="mcp-type-btn active" data-type="SKILLS" type="button" data-i18n="settings.mounts.type_skills">技能 (SKILLS)</button>
                                        <button class="mcp-type-btn" data-type="AGENTS" type="button" data-i18n="settings.mounts.type_agents">子代理 (AGENTS)</button>
                                        <button class="mcp-type-btn" data-type="FILES" type="button" data-i18n="settings.mounts.type_files">文件 (FILES)</button>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label data-i18n="settings.mounts.path_label">映射路径 <span class="required">*</span></label>
                                    <input type="text" id="mountsPath" placeholder="~/.myapp/skills/" data-i18n-placeholder="settings.mounts.path_placeholder"/>
                                    <div class="form-hint" data-i18n="settings.mounts.path_hint">文件所在的本地目录路径（支持 './' 工作区路径和 '~/' 用户目录路径）</div>
                                </div>
                                <div class="form-group" id="mountsWriteableGroup">
                                    <label data-i18n="settings.mounts.writeable_label">开放写权限</label>
                                    <label class="toggle-switch">
                                        <input type="checkbox" id="mountsWriteable"/>
                                        <span class="toggle-slider"></span>
                                    </label>
                                </div>
                                <div class="form-group">
                                    <label data-i18n="settings.mounts.description_label">描述（可选）</label>
                                    <input type="text" id="mountsDescription" placeholder="简要描述此挂载用途" data-i18n-placeholder="settings.mounts.description_placeholder"/>
                                </div>
                                <div class="form-actions form-actions-end">
                                    <button class="btn-primary" id="mountsSaveBtn" data-i18n="settings.save">保存</button>
                                </div>
