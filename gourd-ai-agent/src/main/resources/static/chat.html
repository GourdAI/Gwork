<!-- chat.html — Chat 模式界面片段（欢迎页 + 对话视图）。由 index.html 的 bootstrap 注入到 .main-area。 -->
<template data-mount=".main-area">
    <!-- Welcome View -->
    <div class="welcome-view" id="welcomeView">
        <a class="welcome-avatar" href="https://www.gourdwork.com/" target="_blank" rel="noopener noreferrer" title="了解更多关于 GWork" data-i18n-title="app.learn_more">
            <img src="/img/favicon.png" alt="GWork" />
        </a>
        <div class="welcome-title" id="welcomeTitle" data-i18n="app.welcome_title">你好，我是 GWork ！</div>
        <div class="welcome-sub" data-i18n="app.welcome_sub">需要什么帮助吗?</div>
        <!-- Chat 模式工作空间选择器（会话按所选工作空间隔离存储；不选 = 默认工作区） -->
        <div class="workspace-selector-row">
            <div class="project-selector workspace-selector">
                <div class="project-selector-current workspace-selector-current" data-i18n-title="app.chat_workspace.switch">
                    <svg class="workspace-folder-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                    <button type="button" class="workspace-selector-clear" title="清除选择" data-i18n-title="app.chat_workspace.clear">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    </button>
                    <span class="project-selector-name workspace-selector-name"></span>
                    <i class="layui-icon layui-icon-down"></i>
                </div>
                <div class="project-dropdown workspace-dropdown"></div>
            </div>
        </div>
        <div class="welcome-input-box" id="welcomeDropZone">
            <div class="drop-overlay" id="welcomeDropOverlay">
                <div class="drop-overlay-content">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                    <span data-i18n="app.drop_attach">松开以添加附件</span>
                </div>
            </div>
            <div class="attachments-wrap" id="welcomeAttachmentsWrap"></div>
            <div class="input-resize-handle" data-i18n-title="app.resize_input"></div>
            <div style="position:relative">
                <div class="cmd-complete" id="welcomeCmdComplete"></div>
                <textarea id="welcomeInput" data-i18n-placeholder="app.placeholder_welcome" rows="1" autofocus style="width: 100%;"></textarea>
            </div>
            <div class="welcome-toolbar">
                <div class="toolbar-left">
                    <div class="model-selector" id="welcomeModelSelector">
                        <div class="model-selector-current" id="welcomeModelCurrent" data-i18n-title="app.switch_model">
                            <svg class="model-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 2v2M15 2v2M9 20v2M15 20v2M2 9h2M2 15h2M20 9h2M20 15h2"/></svg>
                            <span class="model-name" id="welcomeModelName" data-i18n="app.loading">加载中...</span>
                            <span class="model-thinking-tag" id="welcomeModelThinkingTag" style="display:none"></span>
                            <i class="layui-icon layui-icon-down model-arrow"></i>
                        </div>
                        <div class="model-dropdown has-search" id="welcomeModelDropdown">
                            <div class="model-dropdown-search">
                                <svg class="model-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
                                <input type="text" class="model-search-input" id="welcomeModelSearch" autocomplete="off" spellcheck="false" data-i18n-placeholder="history.model_search_placeholder" />
                                <span class="model-search-clear" style="display:none">&#10005;</span>
                            </div>
                            <div class="model-dropdown-list" id="welcomeModelList"></div>
                        </div>
                    </div>
                    <div class="plus-menu-wrap">
                        <button class="plus-btn" id="welcomePlusBtn" data-i18n-title="app.plus_more">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                        </button>
                        <div class="plus-menu">
                            <button class="plus-menu-item" id="welcomeAttachBtn">
                                <svg viewBox="0 0 24 24"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                                <span data-i18n="app.attach_file">附加文件</span>
                            </button>
                            <button class="plus-menu-item" id="welcomeImageBtn">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
                                <span data-i18n="app.attach_image">附加图片</span>
                            </button>
                            <div class="plus-menu-sep"></div>
                            <button class="plus-menu-item" id="welcomeCmdBtn">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20L16 4"/><circle cx="8" cy="12" r="2"/><circle cx="16" cy="12" r="2"/></svg>
                                <span data-i18n="app.cmd_commands">快捷命令</span>
                            </button>
                            <button class="plus-menu-item" id="welcomeSkillBtn">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><text x="4" y="18" font-size="18" font-weight="bold" font-family="monospace" fill="currentColor" stroke="none">$</text></svg>
                                <span data-i18n="app.skills">技能</span>
                            </button>
                            <button class="plus-menu-item" id="welcomeAgentBtn">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/><line x1="19" y1="2" x2="19" y2="6"/><line x1="17" y1="4" x2="21" y2="4"/></svg>
                                <span data-i18n="app.subagent">子代理</span>
                            </button>
                            <div class="plus-menu-sep"></div>
                            <button class="plus-menu-item" id="welcomeHistoryBtn" disabled>
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                                <span data-i18n="app.history_msg">历史消息</span>
                            </button>
                        </div>
                    </div>
                    <input type="file" class="attach-input" id="welcomeAttachInput" multiple accept="*/*"/>
                    <input type="file" class="attach-input" id="welcomeImageInput" multiple accept="image/*"/>
                </div>
                <div class="toolbar-right">
                    <button class="voice-btn hidden" id="welcomeVoiceBtn" data-i18n-title="app.voice_input">
                        <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
                    </button>
                    <button class="welcome-send-btn" id="welcomeSendBtn" data-i18n-title="app.send">
                        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                    </button>
                </div>
            </div>
        </div>
        <!-- 消息执行队列 -->
        <div id="welcome-message-queue-container" style="display:none;">
            <div class="queue-header">
                <span class="queue-title" data-i18n="queue.title">消息执行队列</span>
                <span class="queue-stats-count" id="welcome-queue-count">0</span>
                <button id="welcome-queue-clear-btn" class="queue-clear-btn" data-i18n="queue.clear" data-i18n-title="queue.clear">清空</button>
            </div>
            <div id="welcome-message-queue-list" class="queue-list"></div>
        </div>
    </div>

    <!-- Chat View -->
    <div class="chat-view" id="chatView">
        <!-- Code 模式：右栏对话标签页栏（每个 tab = 一个会话）；chat 模式隐藏 -->
        <div class="code-chat-header">
            <div class="code-chat-tabs" id="codeChatTabs"></div>
            <div class="code-chat-list" id="codeChatList">
                <button class="code-chat-list-btn" id="codeChatListBtn" data-i18n-title="app.all_sessions">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                </button>
                <div class="code-chat-list-menu" id="codeChatListMenu"></div>
            </div>
            <button class="code-chat-tab-new" id="codeChatNewBtn" data-i18n-title="app.new_session">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </button>
            <button class="code-chat-collapse-btn" id="codeChatCollapseBtn" data-i18n-title="app.collapse_chat">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
            </button>
        </div>
        <div class="messages-wrap" id="messagesWrap">
            <!-- Per-session containers are added here dynamically -->
        </div>
        <div class="input-wrap" style="position:relative;">
            <div class="context-status" id="chatContextStatus" style="display:none"><span class="context-status-text">Context: -- / -- (--%)</span></div>
            <div class="todo-chip-wrap" id="chatTodoChipWrap" style="display:none">
                <button class="todo-chip" id="chatTodoChip" data-i18n-title="app.view_tasks">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
                    <span class="todo-chip-label" data-i18n="app.tasks">任务</span>
                    <span class="todo-badge" id="todoBadge" style="display:none">0</span>
                </button>
                <button class="queue-chip" id="chatQueueChip" style="display:none" data-i18n-title="app.view_queue">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
                    <span class="queue-chip-label" data-i18n="app.queue">队列</span>
                    <span class="queue-badge" id="queueBadge" style="display:none">0</span>
                </button>
                <!-- 任务执行中的键位提示：Enter 插话 / Tab 排队 / 停止。
                     与 chip 同行右对齐，不额外占用垂直空间；由 app-base.js 按 isStreaming 切换显隐。 -->
                <div class="run-hint" id="chatRunHint" style="display:none">
                    <span class="run-hint-item">
                        <kbd class="run-hint-kbd">⏎</kbd>
                        <span class="run-hint-text" data-i18n="app.run_hint_steer">插话纠错</span>
                    </span>
                    <span class="run-hint-sep">·</span>
                    <span class="run-hint-item">
                        <kbd class="run-hint-kbd">⇥</kbd>
                        <span class="run-hint-text" data-i18n="app.run_hint_queue">加入队列</span>
                    </span>
                    <span class="run-hint-sep">·</span>
                    <span class="run-hint-item">
                        <kbd class="run-hint-kbd run-hint-kbd-wide">⇧⏎</kbd>
                        <span class="run-hint-text" data-i18n="app.run_hint_newline">换行</span>
                    </span>
                </div>
            </div>
        <!-- 输入框（放在面板前面，让面板在 DOM 最后渲染=最上层） -->
        <div class="input-box" id="chatDropZone">
                <div class="drop-overlay" id="chatDropOverlay">
                    <div class="drop-overlay-content">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                        <span data-i18n="app.drop_attach">松开以添加附件</span>
                    </div>
                </div>
                <div class="attachments-wrap" id="chatAttachmentsWrap"></div>
                <div class="input-resize-handle" data-i18n-title="app.resize_input"></div>
                <div style="position:relative;">
                    <div class="cmd-complete" id="chatCmdComplete"></div>
                    <div class="history-panel" id="chatHistoryPanel"></div>
                    <textarea id="chatInput" data-i18n-placeholder="app.placeholder_chat" rows="1" style="width:100%"></textarea>
                </div>
                <div class="input-toolbar">
                    <div class="toolbar-left">
                        <div class="model-selector" id="chatModelSelector">
                            <div class="model-selector-current" id="chatModelCurrent" data-i18n-title="app.switch_model">
                                <svg class="model-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 2v2M15 2v2M9 20v2M15 20v2M2 9h2M2 15h2M20 9h2M20 15h2"/></svg>
                                <span class="model-name" id="chatModelName" data-i18n="app.loading">加载中...</span>
                                <span class="model-thinking-tag" id="chatModelThinkingTag" style="display:none"></span>
                                <i class="layui-icon layui-icon-down model-arrow"></i>
                            </div>
                            <div class="model-dropdown has-search" id="chatModelDropdown">
                                <div class="model-dropdown-search">
                                    <svg class="model-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
                                    <input type="text" class="model-search-input" id="chatModelSearch" autocomplete="off" spellcheck="false" data-i18n-placeholder="history.model_search_placeholder" />
                                    <span class="model-search-clear" style="display:none">&#10005;</span>
                                </div>
                                <div class="model-dropdown-list" id="chatModelList"></div>
                            </div>
                        </div>
                        <div class="plus-menu-wrap">
                            <button class="plus-btn" id="chatPlusBtn" data-i18n-title="app.plus_more">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                            </button>
                            <div class="plus-menu">
                                <button class="plus-menu-item" id="chatAttachBtn">
                                    <svg viewBox="0 0 24 24"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                                    <span data-i18n="app.attach_file">附加文件</span>
                                </button>
                                <button class="plus-menu-item" id="chatImageBtn">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
                                    <span data-i18n="app.attach_image">附加图片</span>
                                </button>
                                <div class="plus-menu-sep"></div>
                                <button class="plus-menu-item" id="chatCmdBtn">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20L16 4"/><circle cx="8" cy="12" r="2"/><circle cx="16" cy="12" r="2"/></svg>
                                    <span data-i18n="app.cmd_commands">快捷命令</span>
                                </button>
                                <button class="plus-menu-item" id="chatSkillBtn">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><text x="4" y="18" font-size="18" font-weight="bold" font-family="monospace" fill="currentColor" stroke="none">$</text></svg>
                                    <span data-i18n="app.skills">技能</span>
                                </button>
                                <button class="plus-menu-item" id="chatAgentBtn">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/><line x1="19" y1="2" x2="19" y2="6"/><line x1="17" y1="4" x2="21" y2="4"/></svg>
                                    <span data-i18n="app.subagent">子代理</span>
                                </button>
                                <div class="plus-menu-sep"></div>
                                <button class="plus-menu-item" id="chatHistoryBtn">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                                    <span data-i18n="app.history_msg">历史消息</span>
                                </button>
                            </div>
                        </div>
                        <input type="file" class="attach-input" id="chatAttachInput" multiple accept="*/*"/>
                        <input type="file" class="attach-input" id="chatImageInput" multiple accept="image/*"/>
                    </div>
                    <div class="toolbar-right">
                        <button class="voice-btn hidden" id="chatVoiceBtn" data-i18n-title="app.voice_input">
                            <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
                        </button>
                        <button class="send-btn" id="chatSendBtn" data-i18n-title="app.send">
                            <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                        </button>
                    </div>
                </div>
            </div>
            <!-- 任务面板（悬浮在 chip 按钮上方，DOM 最后=最上层） -->
            <div class="todo-float-panel" id="chatTodoPanel" style="display:none">
                <div class="todo-panel">
                    <div class="todo-header">
                    <div class="todo-title" data-i18n="app.current_tasks">当前任务 <span class="todo-stats-count" id="todoStats" style="display:none"></span></div>
                        <button class="todo-refresh-btn" id="todoRefreshBtn" data-i18n-title="app.refresh">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
                        </button>
                    </div>
                    <div class="todo-list" id="todoList"></div>
                    <div class="todo-empty" id="todoEmpty" style="display:none" data-i18n="app.no_tasks">当前会话暂无任务清单</div>
                </div>
            </div>
            <!-- 消息执行队列（悬浮在 chip 按钮上方，DOM 最后=最上层） -->
            <div id="message-queue-container" class="collapsed" style="display:none;">
                <div class="queue-header">
                    <span class="queue-title" data-i18n="queue.title">消息执行队列</span>

                    <button id="queue-clear-btn" class="queue-clear-btn" data-i18n="queue.clear" data-i18n-title="queue.clear">清空</button>
                </div>
                <div id="message-queue-list" class="queue-list"></div>
            </div>
        </div>
        </div>
    </div>
</template>
