<!-- memory.html — 记忆独立主视图片段（与自动化/技能/远控通道/模型配置同构），由 app-bootstrap.js 装配到 .main-area -->
<!-- 布局对齐参考图：页头 + 开关卡片（左标题描述/右开关）+ 已保存记忆区（workspace/global 双 tab + 刷新 + 可删除条目列表） -->
<template data-mount=".main-area">
<div class="memory-view" id="memoryView">
    <div class="memory-view-scroll">
        <div class="memory-view-inner">
            <!-- 头部：标题 + 描述（与自动化/技能视图页头同构） -->
            <div class="memory-view-header">
                <div class="memory-view-headtext">
                    <h1 class="memory-view-title" data-i18n="memory_view.title">记忆</h1>
                    <div class="memory-view-subtitle" data-i18n="memory_view.desc">查看与管理 Agent 的长期记忆，条目可手动删除</div>
                </div>
                <!-- 关闭按钮：仅专注模式弹层打开时显示（.memory-overlay，见 memory-view.css） -->
                <button class="memory-overlay-close" id="memoryViewCloseBtn" type="button" data-i18n-title="memory.close">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>

            <!-- 开关卡片 1：心智记忆总开关 -->
            <div class="memory-switch-card">
                <div class="memory-switch-info">
                    <div class="memory-switch-title" data-i18n="settings.general.memory.title">心智记忆</div>
                    <div class="memory-switch-desc" data-i18n="settings.general.memory.enabled_desc">跨会话保留长期记忆；关闭可减少上下文消耗</div>
                </div>
                <label class="toggle-switch">
                    <input type="checkbox" id="memoryEnabledSwitch"/>
                    <span class="toggle-slider"></span>
                </label>
            </div>

            <!-- 开关卡片 2：记忆隔离 -->
            <div class="memory-switch-card">
                <div class="memory-switch-info">
                    <div class="memory-switch-title" data-i18n="memory_view.isolation_title">记忆隔离</div>
                    <div class="memory-switch-desc" data-i18n="settings.general.memory.isolation_desc">每个工作区使用独立记忆；关闭后使用全局共享记忆</div>
                </div>
                <label class="toggle-switch">
                    <input type="checkbox" id="memoryIsolationSwitch"/>
                    <span class="toggle-slider"></span>
                </label>
            </div>

            <!-- 已保存的记忆 -->
            <div class="memory-saved-header">
                <div class="memory-saved-text">
                    <div class="memory-saved-title" data-i18n="memory_view.saved_title">已保存的记忆</div>
                    <div class="memory-saved-desc" data-i18n="memory_view.saved_desc">切换工作区与全局域，查看已保存的记忆</div>
                </div>
                <button class="memory-view-icon-btn" id="memoryViewRefreshBtn" data-i18n-title="memory.refresh">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>
                </button>
            </div>
            <div class="memory-saved-tabs">
                <button class="memory-view-tab active" data-scope="workspace" data-i18n="memory.tab_workspace">工作空间</button>
                <button class="memory-view-tab" data-scope="global" data-i18n="memory.tab_global">全局</button>
            </div>
            <div class="memory-saved-meta" id="memoryViewMeta"></div>
            <div class="memory-saved-list" id="memoryViewList">
                <div class="memory-empty" data-i18n="memory.loading">加载中...</div>
            </div>
        </div>
    </div>
</div>
</template>
