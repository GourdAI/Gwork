server.port: 4808

# 静态资源客户端缓存秒数。框架默认 600（10 分钟强缓存），仅 debug 模式才自动为 0。
# 设 0 改为协商缓存（Last-Modified + 304）：改完前端文件刷新即生效，
# 不必等 10 分钟、更不必靠「重启服务」——重启对浏览器已有的强缓存毫无作用，
# 曾导致「重启几次界面一点没变」的排查空转。304 响应体极小，代价可忽略；
# 桌面端升级后也能立即看到新界面，不会被旧缓存压住。
solon.staticfiles.cacheMaxAge: 0

server.request:
  # 不限制请求体和单文件大小；超长输入仍会在前端自动折叠为 TXT 附件
  maxBodySize: -1
  maxFileSize: -1

solon.app:
  name: "gwork"
  title: "GWork"

solon.logging.appender:
  console:
    enable: false
  file:
    level: DEBUG
    # 默认值兜底：仅 App.main 会注入 gwork.log.dir（见 App.java）。任何不经过 App.main 的
    # 框架启动路径（单测、未来新入口）若解析不到该占位符，最坏会在磁盘上建出名为
    # "${gwork.log.dir}" 的字面量目录。
    name: "${gwork.log.dir:.gwork/logs}/${solon.app.name}"

solon:
  logging:
    logger:
      "org.eclipse.jetty":
        level: ERROR
      "io.modelcontextprotocol":
        level: ERROR
