<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>GWork</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      background-size: 200% 200%;
      animation: gradientShift 8s ease infinite;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      -webkit-app-region: no-drag;
      user-select: none;
      overflow: hidden;
      position: relative;
    }

    /* 背景粒子效果 */
    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(circle at 20% 50%, rgba(79, 195, 247, 0.05) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(138, 43, 226, 0.05) 0%, transparent 50%),
        radial-gradient(circle at 40% 20%, rgba(26, 188, 156, 0.05) 0%, transparent 50%);
      animation: particleFloat 15s ease-in-out infinite;
      pointer-events: none;
    }

    .loader-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeInUp 0.8s ease-out;
    }

    /* 多层圆环加载动画 */
    .loader {
      position: relative;
      width: 120px;
      height: 120px;
      margin-bottom: 40px;
    }

    .loader-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 3px solid transparent;
    }

    .loader-ring:nth-child(1) {
      border-top-color: #4fc3f7;
      border-right-color: #4fc3f7;
      animation: rotate 1.5s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
    }

    .loader-ring:nth-child(2) {
      width: 80%;
      height: 80%;
      top: 10%;
      left: 10%;
      border-top-color: #1abc9c;
      border-right-color: #1abc9c;
      animation: rotate 2s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite reverse;
      animation-delay: 0.1s;
    }

    .loader-ring:nth-child(3) {
      width: 60%;
      height: 60%;
      top: 20%;
      left: 20%;
      border-top-color: #8a2be2;
      border-right-color: #8a2be2;
      animation: rotate 2.5s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
      animation-delay: 0.2s;
    }

    /* 中心发光效果 */
    .loader::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 40px;
      height: 40px;
      background: radial-gradient(circle, rgba(79, 195, 247, 0.4), transparent 70%);
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }

    .title {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 16px;
      color: #ffffff;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #ffffff 0%, #4fc3f7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 3s ease-in-out infinite;
      background-size: 200% 200%;
    }

    #status {
      font-size: 14px;
      color: #a0a0a0;
      text-align: center;
      line-height: 1.8;
      animation: fadeIn 1s ease-out 0.3s both;
      opacity: 0.9;
    }

    /* 动画定义 */
    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    @keyframes particleFloat {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(30px, -30px) scale(1.1); }
      66% { transform: translate(-20px, 20px) scale(0.9); }
    }

    @keyframes rotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 0.6;
        transform: translate(-50%, -50%) scale(1);
      }
      50% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.3);
      }
    }

    @keyframes shimmer {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 0.9; }
    }

    /* 错误状态样式 */
    #status .error {
      color: #ff6b6b;
      animation: shake 0.5s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-10px); }
      75% { transform: translateX(10px); }
    }
  </style>
</head>
<body data-theme="dark">
  <div class="loader-container">
    <div class="loader">
      <div class="loader-ring"></div>
      <div class="loader-ring"></div>
      <div class="loader-ring"></div>
    </div>
    <div class="title">GWork</div>
    <div id="status">正在启动服务...</div>
  </div>
</body>
</html>
