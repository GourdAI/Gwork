<!doctype html>
<html lang="zh-CN" data-theme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#fafafa">
  <!-- color-scheme 由 app.js 的 applyTheme() 按三态同步，避免强制浅色时原生控件仍按系统深色渲染 -->
  <meta name="color-scheme" content="light dark">
  <title>GWork</title>
  <link rel="icon" type="image/png" href="./assets/gwork-logo.png">
  <link rel="apple-touch-icon" href="./assets/gwork-logo.png">
  <link rel="stylesheet" href="./css/theme.css">
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <div id="app" class="app-root">
    <!-- 四页容器：由 app.js 按状态渲染，默认 tasks -->
    <main id="page-root" class="page-root" aria-live="polite"></main>

    <!-- 固定底部 4 Tab（参考图 75/77/80/81） -->
    <nav id="tabbar" class="tabbar" role="tablist" aria-label="主导航"></nav>

    <!-- 遮罩层：抽屉 / sheet 共用 -->
    <div id="scrim" class="scrim" hidden></div>

    <!-- 侧滑抽屉（参考图 76） -->
    <aside id="drawer" class="drawer" role="dialog" aria-label="云端任务" aria-modal="true" hidden></aside>

    <!-- 底部 sheet 容器（参考图 74/78/82） -->
    <section id="sheet" class="sheet" role="dialog" aria-modal="true" hidden></section>
  </div>

  <script src="./js/icons.js"></script>
  <script src="./js/data.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
